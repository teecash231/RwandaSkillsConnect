<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My E-Wallet | Rwanda SkillsConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#0056B3;--secondary:#00C896;--dark:#1A1F36;--gray:#64748B;--border:#E2E8F0;}
    body{font-family:'Open Sans',sans-serif;background:#F8FAFC;color:var(--dark);}
    h1,h2,h3,h4,h5,h6{font-family:'Poppins',sans-serif;}
    .sidebar{width:260px;min-height:100vh;background:#fff;border-right:1px solid var(--border);position:fixed;top:0;left:0;z-index:100;padding:1.5rem 0;}
    .sidebar-brand{padding:0 1.5rem 1.5rem;border-bottom:1px solid var(--border);margin-bottom:1rem;}
    .sidebar-brand a{font-family:'Poppins',sans-serif;font-weight:700;font-size:1.3rem;color:var(--primary);text-decoration:none;}
    .nav-link{color:var(--dark);padding:.6rem 1.5rem;border-radius:0;transition:all .2s;}
    .nav-link:hover,.nav-link.active{color:var(--primary);background:#E8F2FF;}
    .nav-link i{width:20px;margin-right:.75rem;}
    .main-content{margin-left:260px;padding:2rem;}
    .balance-card{background:linear-gradient(135deg,var(--primary) 0%,#003D82 100%);color:#fff;border-radius:16px;padding:2rem;}
    .stat-card{background:#fff;border-radius:12px;padding:1.5rem;box-shadow:0 2px 12px rgba(0,0,0,.06);border-left:4px solid var(--primary);}
    .tx-badge{font-size:.75rem;padding:.3rem .6rem;border-radius:6px;}
    .tx-credit{background:#D1FAE5;color:#065F46;}
    .tx-debit{background:#FEE2E2;color:#991B1B;}
    .tx-pending{background:#FEF3C7;color:#92400E;}
    @media(max-width:991px){.sidebar{transform:translateX(-100%);}.main-content{margin-left:0;}}
  </style>
</head>
<body>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <a href="index.html"><i class="fas fa-hands-helping me-2" style="color:var(--secondary)"></i>SkillsConnect</a>
    </div>
    <ul class="nav flex-column" id="sidebarNav">
      <!-- populated by JS -->
    </ul>
    <div style="border-top:1px solid var(--border);padding:8px 0;margin-top:auto;">
      <a class="nav-link" href="client-settings.html"><i class="fas fa-cog"></i> Settings</a>
      <a class="nav-link text-danger" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="mb-1">My E-Wallet</h4>
        <p class="text-muted mb-0">Manage your balance, deposits and withdrawals</p>
      </div>
      <div id="depositBtnWrap"></div>
    </div>

    <!-- Balance Card -->
    <div class="balance-card mb-4">
      <div class="row align-items-center">
        <div class="col-md-6">
          <p class="mb-1 opacity-75"><i class="fas fa-wallet me-2"></i>Available Balance</p>
          <h2 class="mb-0 fw-bold" id="balanceDisplay">RWF —</h2>
          <small class="opacity-75" id="pendingDisplay"></small>
        </div>
        <div class="col-md-6 text-md-end mt-3 mt-md-0">
          <a href="withdraw.html" class="btn btn-light me-2"><i class="fas fa-money-bill-wave me-1"></i> Withdraw</a>
          <button class="btn btn-outline-light" id="depositBtn"><i class="fas fa-plus me-1"></i> Deposit</button>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="stat-card" style="border-color:#00C896">
          <p class="text-muted mb-1 small">Total Received</p>
          <h5 class="mb-0" id="totalReceived">RWF —</h5>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card" style="border-color:#F59E0B">
          <p class="text-muted mb-1 small">Total Withdrawn</p>
          <h5 class="mb-0" id="totalWithdrawn">RWF —</h5>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card">
          <p class="text-muted mb-1 small">Transactions</p>
          <h5 class="mb-0" id="txCount">—</h5>
        </div>
      </div>
    </div>

    <!-- Deposit Modal -->
    <div class="modal fade" id="depositModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title"><i class="fas fa-plus-circle me-2 text-primary"></i>Deposit Funds</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="depositAlert"></div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Amount (RWF) <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text">RWF</span>
                <input type="number" id="depositAmount" class="form-control" min="500" step="100" placeholder="Minimum 500">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
              <input type="tel" id="depositPhone" class="form-control" placeholder="07XXXXXXXX">
              <div class="form-text">MTN or Airtel number for reference</div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="confirmDeposit">
              <span id="depositSpinner" class="spinner-border spinner-border-sm d-none me-2"></span>
              <i class="fas fa-plus me-1"></i> Add Funds
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Transactions -->
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h6 class="mb-0">Transaction History</h6>
        <span class="badge bg-light text-dark" id="txBadge"></span>
      </div>
      <div class="card-body p-0">
        <div id="txList">
          <div class="text-center py-5 text-muted">
            <div class="spinner-border text-primary mb-3"></div>
            <p>Loading transactions...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/ewallet.js"></script>
  <script>
  (async () => {
    const { data: { user } } = await window.supabaseClient.auth.getUser();
    if (!user) { location.href = 'login.html'; return; }

    const { data: profile } = await window.supabaseClient.from('profiles').select('role').eq('id', user.id).single();
    const role = profile?.role || 'worker';
    const workerNav = [
      { href:'freelancer-dashboard.html', icon:'fa-tachometer-alt', label:'Overview' },
      { href:'profile.html', icon:'fa-user', label:'My Profile' },
      { href:'find-jobs.html', icon:'fa-search', label:'Find Jobs' },
      { href:'my-applications.html', icon:'fa-file-alt', label:'Applications' },
      { href:'worker-earnings.html', icon:'fa-wallet', label:'Earnings' },
      { href:'worker-transactions.html', icon:'fa-history', label:'Transactions' },
      { href:'wallet.html', icon:'fa-wallet', label:'E-Wallet', active:true },
      { href:'withdraw.html', icon:'fa-money-bill-wave', label:'Withdraw' },
      { href:'messages.html', icon:'fa-comments', label:'Messages' },
      { href:'notifications.html', icon:'fa-bell', label:'Notifications' },
    ];
    const employerNav = [
      { href:'employer-dashboard.html', icon:'fa-tachometer-alt', label:'Overview' },
      { href:'profile.html', icon:'fa-building', label:'Company Profile' },
      { href:'post-job.html', icon:'fa-plus', label:'Post Job' },
      { href:'jobs.html', icon:'fa-list', label:'Manage Jobs' },
      { href:'find-workers.html', icon:'fa-search', label:'Find Workers' },
      { href:'job-applications.html', icon:'fa-users', label:'Applicants' },
      { href:'employer-payments.html', icon:'fa-credit-card', label:'Payments' },
      { href:'wallet.html', icon:'fa-wallet', label:'E-Wallet', active:true },
      { href:'withdraw.html', icon:'fa-money-bill-wave', label:'Withdraw' },
      { href:'messages.html', icon:'fa-comments', label:'Messages' },
      { href:'notifications.html', icon:'fa-bell', label:'Notifications' },
    ];
    const nav = role === 'employer' ? employerNav : workerNav;
    document.getElementById('sidebarNav').innerHTML = nav.map(n =>
      `<li class="nav-item"><a class="nav-link${n.active?' active':''}" href="${n.href}"><i class="fas ${n.icon}"></i> ${n.label}</a></li>`
    ).join('');

    // Show deposit button for all roles
    document.getElementById('depositBtnWrap').innerHTML = `<button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#depositModal"><i class="fas fa-plus me-1"></i> Deposit</button>`;
    document.getElementById('depositBtn').addEventListener('click', () => {
      new bootstrap.Modal(document.getElementById('depositModal')).show();
    });

    // Deposit handler
    document.getElementById('confirmDeposit').addEventListener('click', async () => {
      const amount  = parseFloat(document.getElementById('depositAmount').value);
      const phone   = document.getElementById('depositPhone').value.trim();
      const alertEl = document.getElementById('depositAlert');
      const spinner = document.getElementById('depositSpinner');
      const btn     = document.getElementById('confirmDeposit');

      if (!amount || amount < 500) { alertEl.innerHTML = `<div class="alert alert-danger">Minimum deposit is RWF 500</div>`; return; }
      if (!phone) { alertEl.innerHTML = `<div class="alert alert-danger">Phone number is required</div>`; return; }

      spinner.classList.remove('d-none');
      btn.disabled = true;
      try {
        const newBalance = await EwalletService.deposit(user.id, null, amount, phone, null);
        bootstrap.Modal.getInstance(document.getElementById('depositModal')).hide();
        document.getElementById('balanceDisplay').textContent = `RWF ${Number(newBalance).toLocaleString()}`;
        // Reload transactions
        wallet = await EwalletService.getWallet(user.id);
        transactions = await EwalletService.getTransactions(wallet.id, 100);
        location.reload();
      } catch (e) {
        alertEl.innerHTML = `<div class="alert alert-danger"><i class="fas fa-exclamation-circle me-2"></i>${e.message}</div>`;
        spinner.classList.add('d-none');
        btn.disabled = false;
      }
    });

    let wallet, transactions;
    try {
      wallet = await EwalletService.getWallet(user.id);
      transactions = await EwalletService.getTransactions(wallet.id, 100);
    } catch (e) {
      document.getElementById('txList').innerHTML = `<div class="text-center py-4 text-danger"><i class="fas fa-exclamation-circle me-2"></i>${e.message}</div>`;
      return;
    }

    // Balance
    document.getElementById('balanceDisplay').textContent = `RWF ${Number(wallet.available_balance).toLocaleString()}`;
    if (wallet.pending_balance > 0) {
      document.getElementById('pendingDisplay').textContent = `Pending: RWF ${Number(wallet.pending_balance).toLocaleString()}`;
    }

    // Stats
    const received  = transactions.filter(t => ['payment_received','deposit'].includes(t.transaction_type)).reduce((s,t) => s + Number(t.amount), 0);
    const withdrawn = transactions.filter(t => t.transaction_type === 'withdrawal').reduce((s,t) => s + Number(t.amount), 0);
    document.getElementById('totalReceived').textContent  = `RWF ${received.toLocaleString()}`;
    document.getElementById('totalWithdrawn').textContent = `RWF ${withdrawn.toLocaleString()}`;
    document.getElementById('txCount').textContent = transactions.length;
    document.getElementById('txBadge').textContent = `${transactions.length} transactions`;

    // Render transactions
    if (!transactions.length) {
      document.getElementById('txList').innerHTML = `<div class="text-center py-5 text-muted"><i class="fas fa-exchange-alt fa-2x mb-3"></i><p>No transactions yet</p></div>`;
    } else {
      const typeLabel = { deposit:'Deposit', withdrawal:'Withdrawal', payment_sent:'Payment Sent', payment_received:'Payment Received', refund:'Refund' };
      const rows = transactions.map(t => {
        const isCredit = ['deposit','payment_received','refund'].includes(t.transaction_type);
        const badgeClass = t.status === 'completed' ? (isCredit ? 'tx-credit' : 'tx-debit') : 'tx-pending';
        const sign = isCredit ? '+' : '-';
        return `<div class="d-flex align-items-center justify-content-between px-4 py-3 border-bottom">
          <div>
            <div class="fw-semibold">${typeLabel[t.transaction_type] || t.transaction_type}</div>
            <small class="text-muted">${new Date(t.created_at).toLocaleDateString('en-RW',{day:'numeric',month:'short',year:'numeric'})}</small>
            ${t.description ? `<br><small class="text-muted">${t.description}</small>` : ''}
          </div>
          <div class="text-end">
            <div class="fw-bold ${isCredit ? 'text-success' : 'text-danger'}">${sign} RWF ${Number(t.amount).toLocaleString()}</div>
            <span class="tx-badge ${badgeClass}">${t.status}</span>
          </div>
        </div>`;
      }).join('');
      document.getElementById('txList').innerHTML = rows;
    }

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      await window.supabaseClient.auth.signOut();
      location.href = 'login.html';
    });
  })();
  </script>
</body>
</html>
