<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Signup - Rwanda SkillsConnect</title>
    <link rel="stylesheet" href="assets/css/tailwind.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-8">
        <h1 class="text-2xl font-bold mb-6">Debug Signup Process</h1>
        
        <form id="debugForm" class="space-y-4 mb-8">
            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
            </div>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md">Test Signup</button>
        </form>
        
        <div id="results" class="bg-gray-100 p-4 rounded-lg">
            <h3 class="font-semibold mb-2">Debug Results:</h3>
            <pre id="output" class="text-sm"></pre>
        </div>
    </div>

    <script src="js/supabaseClient.js"></script>
    <script>
        document.getElementById('debugForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const output = document.getElementById('output');
            
            output.textContent = 'Testing signup process...\n';
            
            try {
                // Test 1: Check Supabase client
                output.textContent += `✓ Supabase client initialized\n`;
                output.textContent += `URL: ${window.supabaseClient.supabaseUrl}\n`;
                output.textContent += `Key: ${window.supabaseClient.supabaseKey.substring(0, 20)}...\n\n`;
                
                // Test 2: Attempt signup
                output.textContent += 'Attempting signup...\n';
                
                const { data, error } = await window.supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            first_name: 'Test',
                            last_name: 'User',
                            role: 'freelancer'
                        },
                        emailRedirectTo: window.location.origin + '/auth-callback.html'
                    }
                });
                
                if (error) {
                    output.textContent += `❌ Signup Error: ${error.message}\n`;
                    output.textContent += `Error Code: ${error.status || 'N/A'}\n`;
                    return;
                }
                
                output.textContent += `✓ Signup successful!\n`;
                output.textContent += `User ID: ${data.user?.id}\n`;
                output.textContent += `Email: ${data.user?.email}\n`;
                output.textContent += `Email Confirmed: ${data.user?.email_confirmed_at ? 'Yes' : 'No'}\n`;
                output.textContent += `Session: ${data.session ? 'Created' : 'None'}\n\n`;
                
                // Test 3: Check if confirmation email should be sent
                if (!data.user?.email_confirmed_at && !data.session) {
                    output.textContent += `✓ Confirmation email should be sent to ${email}\n`;
                    output.textContent += `Check your email for the confirmation link.\n`;
                } else if (data.session) {
                    output.textContent += `⚠️ User was automatically confirmed (no email needed)\n`;
                } else {
                    output.textContent += `⚠️ Unexpected state - check Supabase settings\n`;
                }
                
            } catch (error) {
                output.textContent += `❌ Unexpected error: ${error.message}\n`;
                console.error('Debug error:', error);
            }
        });
    </script>
</body>
</html>
