<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirming Email - Rwanda SkillsConnect</title>
    <link rel="stylesheet" href="assets/css/tailwind.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-lg shadow-md p-8 text-center">
        <div class="animate-spin w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full mx-auto mb-4"></div>
        <h2 class="text-xl font-semibold text-gray-800 mb-2">Confirming your email...</h2>
        <p class="text-gray-600" id="status">Please wait while we verify your account.</p>
    </div>

    <script src="js/supabaseClient.js"></script>
    <script>
        async function handleCallback() {
            try {
                // Exchange the OAuth/email code for a session
                const { data, error } = await window.supabaseClient.auth.getSession();

                // If no session yet, try exchanging the code from URL
                if (!data.session) {
                    const { data: exchanged, error: exchErr } = await window.supabaseClient.auth.exchangeCodeForSession(window.location.href);
                    if (exchErr) throw exchErr;
                    data.session = exchanged.session;
                    data.user = exchanged.user;
                }

                if (error) throw error;
                if (!data.session) throw new Error('No session established');

                const user = data.session.user;
                const type = new URLSearchParams(window.location.search).get('type');

                if (type === 'recovery') {
                    document.getElementById('status').textContent = 'Password reset confirmed! Redirecting...';
                    setTimeout(() => window.location.href = 'reset-password.html', 2000);
                    return;
                }

                // Ensure profile exists (for OAuth sign-ins, DB trigger may not have role)
                const { data: profile } = await window.supabaseClient
                    .from('profiles')
                    .select('role')
                    .eq('id', user.id)
                    .single();

                if (!profile) {
                    // Create profile for first-time OAuth users — send to role selection
                    await window.supabaseClient.from('profiles').upsert({
                        id: user.id,
                        first_name: user.user_metadata?.full_name?.split(' ')[0] || '',
                        last_name: user.user_metadata?.full_name?.split(' ').slice(1).join(' ') || '',
                        email: user.email,
                        role: 'worker'
                    });
                    document.getElementById('status').textContent = 'Account created! Redirecting...';
                    setTimeout(() => window.location.href = 'role-selection.html', 1500);
                    return;
                }

                document.getElementById('status').textContent = 'Signed in! Redirecting...';
                const dashboards = { admin: 'admin-dashboard.html', employer: 'employer-dashboard.html', worker: 'freelancer-dashboard.html' };
                setTimeout(() => window.location.href = dashboards[profile.role] || 'freelancer-dashboard.html', 1500);

            } catch (error) {
                console.error('Callback error:', error);
                document.getElementById('status').innerHTML = `
                    <span class="text-red-600">Sign-in failed: ${error.message}</span><br>
                    <a href="login.html" class="text-blue-600 hover:underline mt-2 inline-block">Go to Login</a>
                `;
            }
        }

        window.addEventListener('load', handleCallback);
    </script>
</body>
</html>
