<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email - Rwanda SkillsConnect</title>
    <link rel="stylesheet" href="assets/css/tailwind.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-lg shadow-md p-8 text-center">
        <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
        </div>
        
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Verify Your Email</h2>
        <p class="text-gray-600 mb-6">
            Enter the 6-digit code sent to<br>
            <strong id="userEmail" class="text-gray-800"></strong>
        </p>
        
        <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>
        <div id="successMessage" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4"></div>
        
        <form id="otpForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 text-center mb-2">Verification Code</label>
                <input type="text" id="otpCode" maxlength="6" required 
                       class="w-full px-3 py-2 border border-gray-300 rounded-md text-center text-2xl font-mono tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="000000">
            </div>
            
            <button type="submit" id="verifyBtn"
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                Verify Email
            </button>
        </form>
        
        <div class="mt-4 text-center">
            <button id="resendBtn" class="text-blue-600 hover:text-blue-800">
                Resend Code
            </button>
        </div>
        
        <div class="mt-6 pt-6 border-t border-gray-200">
            <a href="login.html" class="text-blue-600 hover:text-blue-800 text-sm">
                ← Back to Sign In
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/verifyOtp.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        
        if (email) {
            document.getElementById('userEmail').textContent = email;
        } else {
            window.location.href = 'role-selection.html';
        }
        
        // Handle OTP form submission
        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const otpCode = document.getElementById('otpCode').value.trim();
            
            if (otpCode.length !== 6) {
                showMessage('Please enter a valid 6-digit code', 'error');
                return;
            }
            
            const verifyBtn = document.getElementById('verifyBtn');
            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verifying...';
            
            const result = await window.verifyOTP(email, otpCode);
            
            if (result.success) {
                showMessage('Email verified successfully! Redirecting...', 'success');
                
                // Create user account with stored password
                const pendingData = JSON.parse(sessionStorage.getItem('pendingUserData') || '{}');
                if (pendingData.password) {
                    try {
                        const { data, error } = await window.supabaseClient.auth.signUp({
                            email: email,
                            password: pendingData.password,
                            options: {
                                data: {
                                    first_name: pendingData.first_name,
                                    last_name: pendingData.last_name,
                                    full_name: `${pendingData.first_name} ${pendingData.last_name}`,
                                    role: pendingData.role
                                }
                            }
                        });
                        
                        if (!error && data.user) {
                            // Auto-confirm the user since OTP was verified
                            await window.supabaseClient.auth.signInWithPassword({
                                email: email,
                                password: pendingData.password
                            });
                        }
                    } catch (signupError) {
                        console.error('Account creation error:', signupError);
                    }
                }
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                showMessage(result.error, 'error');
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Verify Email';
            }
        });
        
        // Handle resend OTP
        document.getElementById('resendBtn').addEventListener('click', async () => {
            const resendBtn = document.getElementById('resendBtn');
            resendBtn.disabled = true;
            resendBtn.textContent = 'Sending...';
            
            try {
                const { error } = await window.supabaseClient.auth.signInWithOtp({
                    email: email,
                    options: { shouldCreateUser: true }
                });
                
                if (error) throw error;
                
                showMessage('New verification code sent!', 'success');
            } catch (error) {
                showMessage('Failed to send code. Please try again.', 'error');
            }
            
            resendBtn.disabled = false;
            resendBtn.textContent = 'Resend Code';
        });
        
        // Auto-format OTP input
        document.getElementById('otpCode').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
            
            if (this.value.length === 6) {
                setTimeout(() => {
                    document.getElementById('otpForm').dispatchEvent(new Event('submit'));
                }, 500);
            }
        });
        
        function showMessage(message, type) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');
            
            if (type === 'error') {
                errorDiv.textContent = message;
                errorDiv.classList.remove('hidden');
            } else {
                successDiv.textContent = message;
                successDiv.classList.remove('hidden');
            }
        }
        
        // Focus on OTP input
        document.getElementById('otpCode').focus();
    </script>
</body>
</html>
