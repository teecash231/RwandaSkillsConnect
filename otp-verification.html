<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email | Rwanda SkillsConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--primary:#0056B3;--primary-light:#E8F2FF;--secondary:#00C896;--accent:#FF6B6B;--dark:#1A1F36;--gray:#64748B;--border:#E2E8F0;--radius:8px;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Open Sans',sans-serif;color:var(--dark);background:#F8FAFC;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    h1,h2,h3,h4,h5,h6{font-family:'Poppins',sans-serif;font-weight:600;}
    .card{width:100%;max-width:420px;background:#fff;border-radius:var(--radius);box-shadow:0 2px 10px rgba(0,0,0,.05);padding:32px;animation:fadeIn .3s ease;}
    .logo{display:inline-flex;align-items:center;gap:10px;color:var(--primary);text-decoration:none;}
    .logo-icon{width:36px;height:36px;background:var(--primary);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;}
    .logo-text{font-size:1.4rem;font-weight:700;font-family:'Poppins',sans-serif;}
    .email-icon{width:64px;height:64px;background:var(--primary-light);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;}
    .email-icon i{font-size:28px;color:var(--primary);}
    .otp-input{width:100%;text-align:center;font-size:2rem;letter-spacing:.5rem;padding:12px;border:2px solid var(--border);border-radius:var(--radius);font-family:'Poppins',sans-serif;font-weight:600;transition:all .2s ease;}
    .otp-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,86,179,.1);outline:none;}
    .btn-verify{width:100%;padding:11px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s ease;display:flex;align-items:center;justify-content:center;gap:8px;}
    .btn-verify:hover{background:#004494;}
    .btn-verify:disabled{background:var(--border);cursor:not-allowed;}
    .alert{border-radius:var(--radius);border:none;padding:10px 14px;margin-bottom:16px;font-size:13px;display:flex;align-items:center;gap:8px;}
    .alert-danger{background:#FFF5F5;color:var(--accent);border-left:3px solid var(--accent);}
    .alert-success{background:#F0FFF4;color:#155724;border-left:3px solid var(--secondary);}
    .resend-btn{background:none;border:none;color:var(--primary);font-weight:600;cursor:pointer;padding:0;font-size:13px;}
    .resend-btn:disabled{color:var(--gray);cursor:not-allowed;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>
  <div class="card">
    <div class="text-center mb-4">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fas fa-hands-helping"></i></div>
        <span class="logo-text">Rwanda SkillsConnect</span>
      </a>
    </div>

    <div class="email-icon"><i class="fas fa-envelope-open-text"></i></div>

    <div class="text-center mb-4">
      <h2 style="font-size:1.3rem;">Verify Your Email</h2>
      <p style="color:var(--gray);font-size:13px;margin-top:6px;">
        We sent a 6-digit code to<br>
        <strong id="emailDisplay" style="color:var(--dark);"></strong>
      </p>
    </div>

    <div id="msg" style="display:none;"></div>

    <form id="otpForm">
      <div class="mb-3">
        <input type="text" id="otpCode" class="otp-input" maxlength="6"
               placeholder="000000" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code">
      </div>
      <button type="submit" class="btn-verify" id="verifyBtn">
        <i class="fas fa-check-circle"></i> Verify Email
      </button>
    </form>

    <p class="text-center mt-3" style="font-size:13px;color:var(--gray);">
      Didn't receive the code?
      <button class="resend-btn" id="resendBtn">Resend</button>
      <span id="resendTimer" style="display:none;color:var(--gray);"> (<span id="countdown">60</span>s)</span>
    </p>
    <p class="text-center mt-2" style="font-size:13px;">
      <a href="login.html" style="color:var(--gray);text-decoration:none;">
        <i class="fas fa-arrow-left me-1"></i> Back to Sign In
      </a>
    </p>
  </div>

  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const email  = params.get('email') ? decodeURIComponent(params.get('email')) : '';
    document.getElementById('emailDisplay').textContent = email || 'your email';

    // Auto-handle if Supabase redirected back with session (magic link / email confirm link)
    supabaseClient.auth.onAuthStateChange(async (event, session) => {
      if (event === 'SIGNED_IN' && session) {
        showMsg('✅ Email verified! Redirecting…', 'success');
        const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', session.user.id).single();
        setTimeout(() => Auth.redirectToDashboard(profile?.role || 'worker'), 1500);
      }
    });

    // OTP digit-only filter + auto-submit at 6 digits
    document.getElementById('otpCode').addEventListener('input', function() {
      this.value = this.value.replace(/\D/g, '').substring(0, 6);
      if (this.value.length === 6) document.getElementById('otpForm').requestSubmit();
    });

    document.getElementById('otpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = document.getElementById('otpCode').value.trim();
      if (token.length !== 6) { showMsg('Please enter the 6-digit code.', 'danger'); return; }

      const btn = document.getElementById('verifyBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying…';

      const { data, error } = await supabaseClient.auth.verifyOtp({ email, token, type: 'signup' });

      if (error) {
        showMsg(error.message || 'Invalid or expired code. Try resending.', 'danger');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify Email';
      } else {
        showMsg('✅ Email verified! Redirecting…', 'success');
        const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', data.user.id).single();
        setTimeout(() => Auth.redirectToDashboard(profile?.role || 'worker'), 1500);
      }
    });

    // Resend with 60s cooldown
    let timer;
    document.getElementById('resendBtn').addEventListener('click', async function() {
      if (!email) { showMsg('Email not found. Please sign up again.', 'danger'); return; }
      this.disabled = true;
      document.getElementById('resendTimer').style.display = 'inline';

      const { error } = await supabaseClient.auth.resend({ type: 'signup', email });
      showMsg(error ? error.message : '📧 Verification code resent!', error ? 'danger' : 'success');

      let secs = 60;
      document.getElementById('countdown').textContent = secs;
      clearInterval(timer);
      timer = setInterval(() => {
        secs--;
        document.getElementById('countdown').textContent = secs;
        if (secs <= 0) {
          clearInterval(timer);
          this.disabled = false;
          document.getElementById('resendTimer').style.display = 'none';
        }
      }, 1000);
    });

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.className = `alert alert-${type}`;
      el.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${text}`;
      el.style.display = 'flex';
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
