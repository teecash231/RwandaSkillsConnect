<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talent Map - Rwanda SkillsConnect</title>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
    #map { height: 600px; width: 100%; }
    .leaflet-popup-content { min-width: 250px; }
    .talent-marker { background: #3b82f6; border: 2px solid white; border-radius: 50%; width: 30px; height: 30px; }
    .current-location-marker { z-index: 1000; }
    .city-marker { z-index: 500; }
    .city-marker:hover { transform: scale(1.1); }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse { animation: pulse 2s infinite; }
  </style>
</head>
<body class="bg-gray-50">
  <header class="bg-white shadow-sm border-b sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4">
      <div class="flex justify-between items-center">
        <a href="client-dashboard.html" class="text-2xl font-bold text-indigo-600">Rwanda SkillsConnect</a>
        <nav class="hidden md:flex items-center space-x-6" id="mainNavigation">
          <a href="client-dashboard.html" class="text-gray-600 hover:text-indigo-600" id="dashboardLink">Dashboard</a>
          <a href="browse.html" class="text-gray-600 hover:text-indigo-600" id="browseLink">Browse Talent</a>
          <a href="map.html" class="text-indigo-600 font-medium" id="mapLink">Talent Map</a>
          <a href="client-menu.html" class="text-gray-600 hover:text-indigo-600" id="menuLink">Menu</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">
    <div class="mb-6">
      <h1 class="text-3xl font-bold text-gray-900 mb-2" id="pageTitle">Talent Map</h1>
      <p class="text-gray-600" id="pageDescription">Discover freelancers across Rwanda by location</p>
    </div>

    <!-- Filters -->
    <div class="bg-white rounded-xl shadow-sm border p-4 mb-6">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <select id="skillFilter" class="w-full p-2 border border-gray-300 rounded-lg text-sm">
            <option value="">All Skills</option>
            <option value="web development">Web Development</option>
            <option value="mobile development">Mobile Development</option>
            <option value="graphic design">Graphic Design</option>
            <option value="content writing">Content Writing</option>
            <option value="ui/ux">UI/UX Design</option>
          </select>
        </div>
        <div>
          <select id="experienceFilter" class="w-full p-2 border border-gray-300 rounded-lg text-sm">
            <option value="">All Experience</option>
            <option value="Entry Level">Entry Level</option>
            <option value="Mid Level">Mid Level</option>
            <option value="Senior Level">Senior Level</option>
          </select>
        </div>
        <div>
          <select id="locationFilter" class="w-full p-2 border border-gray-300 rounded-lg text-sm">
            <option value="">All Locations</option>
            <optgroup label="Kigali City">
              <option value="Kigali">Kigali</option>
              <option value="Gasabo">Gasabo</option>
              <option value="Kicukiro">Kicukiro</option>
              <option value="Nyarugenge">Nyarugenge</option>
            </optgroup>
            <optgroup label="Northern Province">
              <option value="Musanze">Musanze</option>
              <option value="Burera">Burera</option>
              <option value="Gakenke">Gakenke</option>
              <option value="Gicumbi">Gicumbi</option>
              <option value="Rulindo">Rulindo</option>
            </optgroup>
            <optgroup label="Southern Province">
              <option value="Huye">Huye</option>
              <option value="Gisagara">Gisagara</option>
              <option value="Kamonyi">Kamonyi</option>
              <option value="Muhanga">Muhanga</option>
              <option value="Nyamagabe">Nyamagabe</option>
              <option value="Nyanza">Nyanza</option>
              <option value="Nyaruguru">Nyaruguru</option>
              <option value="Ruhango">Ruhango</option>
            </optgroup>
            <optgroup label="Eastern Province">
              <option value="Nyagatare">Nyagatare</option>
              <option value="Bugesera">Bugesera</option>
              <option value="Gatsibo">Gatsibo</option>
              <option value="Kayonza">Kayonza</option>
              <option value="Kirehe">Kirehe</option>
              <option value="Ngoma">Ngoma</option>
              <option value="Rwamagana">Rwamagana</option>
            </optgroup>
            <optgroup label="Western Province">
              <option value="Rubavu">Rubavu</option>
              <option value="Karongi">Karongi</option>
              <option value="Ngororero">Ngororero</option>
              <option value="Nyabihu">Nyabihu</option>
              <option value="Nyamasheke">Nyamasheke</option>
              <option value="Rusizi">Rusizi</option>
              <option value="Rutsiro">Rutsiro</option>
            </optgroup>
          </select>
        </div>
        <div>
          <button onclick="resetFilters()" class="w-full bg-gray-500 text-white p-2 rounded-lg text-sm hover:bg-gray-600">
            Reset Filters
          </button>
        </div>
      </div>
    </div>

    <!-- Map Container -->
    <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
      <div id="map"></div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mt-6">
      <div class="bg-white rounded-lg shadow-sm border p-4 text-center">
        <div class="text-2xl font-bold text-indigo-600" id="totalFreelancers">0</div>
        <div class="text-sm text-gray-600">Total Freelancers</div>
      </div>
      <div class="bg-white rounded-lg shadow-sm border p-4 text-center">
        <div class="text-2xl font-bold text-green-600" id="kigaliCount">0</div>
        <div class="text-sm text-gray-600">In Kigali</div>
      </div>
      <div class="bg-white rounded-lg shadow-sm border p-4 text-center">
        <div class="text-2xl font-bold text-blue-600" id="otherCitiesCount">0</div>
        <div class="text-sm text-gray-600">Other Cities</div>
      </div>
      <div class="bg-white rounded-lg shadow-sm border p-4 text-center">
        <div class="text-2xl font-bold text-purple-600" id="onlineCount">0</div>
        <div class="text-sm text-gray-600">Available Now</div>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="fix-access-control.js"></script>
  <script>
    let map;
    let markers = [];
    let allFreelancers = [];
    let filteredFreelancers = [];

    // Rwanda locations (all 30 districts)
    const rwandaLocations = {
      // Kigali City
      'Kigali': [-1.9441, 30.0619],
      'Gasabo': [-1.9355, 30.1086],
      'Kicukiro': [-1.9685, 30.1029],
      'Nyarugenge': [-1.9536, 30.0606],
      
      // Northern Province
      'Musanze': [-1.4983, 29.6356],
      'Burera': [-1.4667, 29.8667],
      'Gakenke': [-1.6833, 29.7833],
      'Gicumbi': [-1.5833, 30.1167],
      'Rulindo': [-1.7667, 30.0833],
      
      // Southern Province
      'Huye': [-2.5967, 29.7394],
      'Gisagara': [-2.6500, 29.8167],
      'Kamonyi': [-2.0333, 29.9833],
      'Muhanga': [-2.0833, 29.7500],
      'Nyamagabe': [-2.4500, 29.4167],
      'Nyanza': [-2.3500, 29.7500],
      'Nyaruguru': [-2.5833, 29.5000],
      'Ruhango': [-2.1833, 29.8167],
      
      // Eastern Province
      'Nyagatare': [-1.2925, 30.3267],
      'Bugesera': [-2.2167, 30.2000],
      'Gatsibo': [-1.5833, 30.4167],
      'Kayonza': [-1.8833, 30.6167],
      'Kirehe': [-2.2167, 30.7167],
      'Ngoma': [-2.1833, 30.5167],
      'Rwamagana': [-1.9500, 30.4333],
      
      // Western Province
      'Rubavu': [-1.6792, 29.2661],
      'Karongi': [-2.0000, 29.3833],
      'Ngororero': [-1.7833, 29.5167],
      'Nyabihu': [-1.6167, 29.5167],
      'Nyamasheke': [-2.3167, 29.1167],
      'Rusizi': [-2.4833, 28.9000],
      'Rutsiro': [-1.8833, 29.3333]
    };

    document.addEventListener('DOMContentLoaded', function() {
      const session = JSON.parse(localStorage.getItem('userSession') || 'null');
      if (!session) {
        window.location.href = 'login.html';
        return;
      }

      // Update page content and navigation based on role
      if (session.role === 'freelancer') {
        document.getElementById('pageTitle').textContent = 'Job Map';
        document.getElementById('pageDescription').textContent = 'Find job opportunities across Rwanda';
        document.getElementById('mapLink').textContent = 'Job Map';
        
        // Update navigation for freelancers
        const dashboardLink = document.getElementById('dashboardLink');
        const browseLink = document.getElementById('browseLink');
        const menuLink = document.getElementById('menuLink');
        
        if (dashboardLink) {
          dashboardLink.href = 'freelancer-dashboard.html';
        }
        if (browseLink) {
          browseLink.textContent = 'Find Jobs';
        }
        if (menuLink) {
          menuLink.href = 'freelancer-menu.html';
        }
      }

      initializeMap();
      getCurrentLocation();
      loadFreelancers();
      
      // Event listeners
      document.getElementById('skillFilter').addEventListener('change', applyFilters);
      document.getElementById('experienceFilter').addEventListener('change', applyFilters);
      document.getElementById('locationFilter').addEventListener('change', applyFilters);
    });

    function initializeMap() {
      // Initialize map centered on Rwanda
      map = L.map('map').setView([-1.9441, 30.0619], 8);

      // Add tile layer with better styling
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 18,
        minZoom: 7
      }).addTo(map);

      // Add Rwanda boundary
      const rwandaBounds = [
        [-2.8389, 28.8617],
        [-1.0474, 30.8997]
      ];
      
      L.rectangle(rwandaBounds, {
        color: '#3b82f6',
        weight: 2,
        fillOpacity: 0.05,
        dashArray: '5, 5'
      }).addTo(map);

      // Add map controls
      map.addControl(L.control.scale());
    }

    // Get current location
    function getCurrentLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            
            // Add current location marker
            const currentLocationMarker = L.marker([lat, lng], {
              icon: L.divIcon({
                className: 'current-location-marker',
                html: `<div class="w-4 h-4 bg-red-500 rounded-full border-2 border-white shadow-lg animate-pulse"></div>`,
                iconSize: [16, 16],
                iconAnchor: [8, 8]
              })
            }).addTo(map);
            
            currentLocationMarker.bindPopup(`
              <div class="text-center p-2">
                <i class="fas fa-map-marker-alt text-red-500 text-lg mb-2"></i>
                <p class="font-medium">Your Current Location</p>
                <p class="text-sm text-gray-600">Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}</p>
              </div>
            `);
          },
          function(error) {
            console.log('Location access denied or unavailable');
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 600000 }
        );
      }
    }

    function loadFreelancers() {
      const session = JSON.parse(localStorage.getItem('userSession') || 'null');
      
      if (session.role === 'freelancer') {
        // Load approved jobs for freelancers
        allFreelancers = JSON.parse(localStorage.getItem('jobs') || '[]')
          .filter(job => job.status === 'active' && job.adminApproved === true);
      } else {
        // Load freelancers for clients
        allFreelancers = JSON.parse(localStorage.getItem('users') || '[]')
          .filter(user => user.role === 'freelancer');
      }
      
      applyFilters();
    }

    function applyFilters() {
      const session = JSON.parse(localStorage.getItem('userSession') || 'null');
      const skillFilter = document.getElementById('skillFilter').value.toLowerCase();
      const experienceFilter = document.getElementById('experienceFilter').value;
      const locationFilter = document.getElementById('locationFilter').value;

      if (session.role === 'freelancer') {
        // Filter jobs for freelancers
        filteredFreelancers = allFreelancers.filter(job => {
          const matchesSkill = !skillFilter || 
            (job.skills && job.skills.toLowerCase().includes(skillFilter));
          
          const matchesExperience = !experienceFilter || 
            job.experienceLevel === experienceFilter;
          
          const matchesLocation = !locationFilter || 
            job.location === locationFilter;

          return matchesSkill && matchesExperience && matchesLocation;
        });
      } else {
        // Filter freelancers for clients
        filteredFreelancers = allFreelancers.filter(freelancer => {
          const matchesSkill = !skillFilter || 
            (freelancer.skills && freelancer.skills.toLowerCase().includes(skillFilter));
          
          const matchesExperience = !experienceFilter || 
            freelancer.experienceLevel === experienceFilter;
          
          const matchesLocation = !locationFilter || 
            freelancer.location === locationFilter;

          return matchesSkill && matchesExperience && matchesLocation;
        });
      }

      updateMap();
      updateStats();
    }

    function updateMap() {
      const session = JSON.parse(localStorage.getItem('userSession') || 'null');
      // Clear existing markers
      markers.forEach(marker => map.removeLayer(marker));
      markers = [];

      if (session.role === 'freelancer') {
        // Show jobs for freelancers
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        
        filteredFreelancers.forEach((job, index) => {
          const location = job.location || 'Kigali';
          const coords = rwandaLocations[location];
          const client = users.find(u => u.id === job.clientId);
          
          if (coords) {
            const lat = coords[0] + (Math.random() - 0.5) * 0.05;
            const lng = coords[1] + (Math.random() - 0.5) * 0.05;

            const marker = L.marker([lat, lng], {
              icon: L.divIcon({
                className: 'talent-marker',
                html: `<div class="w-8 h-8 bg-green-600 rounded-full border-2 border-white flex items-center justify-center shadow-lg">
                         <i class="fas fa-briefcase text-white text-xs"></i>
                       </div>`,
                iconSize: [32, 32],
                iconAnchor: [16, 16]
              })
            });

            const popupContent = `
              <div class="p-2">
                <div class="mb-3">
                  <h3 class="font-semibold text-gray-900">${job.title}</h3>
                  <p class="text-sm text-gray-600">${job.clientName}</p>
                </div>
                
                <div class="space-y-2 mb-3">
                  <p class="text-sm"><span class="font-medium">Location:</span> ${job.location}</p>
                  <p class="text-sm"><span class="font-medium">Budget:</span> RWF ${parseInt(job.salary).toLocaleString()}</p>
                  <p class="text-sm"><span class="font-medium">Type:</span> ${job.projectType || 'Fixed Price'}</p>
                </div>
                
                <p class="text-sm text-gray-600 mb-3">${job.description.substring(0, 100)}...</p>
                
                ${job.skills ? `
                  <div class="mb-3">
                    <p class="text-sm font-medium mb-1">Skills Required:</p>
                    <div class="flex flex-wrap gap-1">
                      ${job.skills.split(',').slice(0, 3).map(skill => 
                        `<span class="px-2 py-1 bg-green-100 text-green-800 text-xs rounded">${skill.trim()}</span>`
                      ).join('')}
                    </div>
                  </div>
                ` : ''}
                
                <div class="flex space-x-2">
                  <button onclick="showClientProfile('${job.clientId}')" class="flex-1 bg-indigo-600 text-white px-3 py-1 rounded text-sm hover:bg-indigo-700">
                    View Client
                  </button>
                  <button onclick="connectWithClient('${job.clientId}')" class="flex-1 bg-green-600 text-white px-3 py-1 rounded text-sm hover:bg-green-700">
                    Connect
                  </button>
                </div>
              </div>
            `;

            marker.bindPopup(popupContent, {
              maxWidth: 300,
              className: 'talent-popup'
            });

            marker.addTo(map);
            markers.push(marker);
          }
        });
      } else {
        // Show freelancers for clients (existing code)
        filteredFreelancers.forEach((freelancer, index) => {
          const location = freelancer.location || 'Kigali';
          const coords = rwandaLocations[location];
          
          if (coords) {
            const lat = coords[0] + (Math.random() - 0.5) * 0.05;
            const lng = coords[1] + (Math.random() - 0.5) * 0.05;

            const marker = L.marker([lat, lng], {
              icon: L.divIcon({
                className: 'talent-marker',
                html: `<div class="w-8 h-8 bg-indigo-600 rounded-full border-2 border-white flex items-center justify-center shadow-lg">
                         <span class="text-white text-xs font-bold">${freelancer.fullName.charAt(0)}</span>
                       </div>`,
                iconSize: [32, 32],
                iconAnchor: [16, 16]
              })
            });

            const popupContent = `
              <div class="p-2">
                <div class="flex items-center space-x-3 mb-3">
                  ${freelancer.profilePhoto ? 
                    `<img src="${freelancer.profilePhoto}" class="w-12 h-12 rounded-full object-cover">` :
                    `<div class="w-12 h-12 bg-indigo-500 rounded-full flex items-center justify-center">
                       <span class="text-white font-bold">${freelancer.fullName.charAt(0)}</span>
                     </div>`
                  }
                  <div>
                    <h3 class="font-semibold text-gray-900">${freelancer.fullName}</h3>
                    <p class="text-sm text-gray-600">${freelancer.professionalTitle || 'Professional'}</p>
                  </div>
                </div>
                
                <div class="space-y-2 mb-3">
                  <p class="text-sm"><span class="font-medium">Location:</span> ${freelancer.location || 'Not specified'}</p>
                  <p class="text-sm"><span class="font-medium">Experience:</span> ${freelancer.experienceLevel || 'Not specified'}</p>
                  <p class="text-sm"><span class="font-medium">Rate:</span> ${freelancer.hourlyRate ? 'RWF ' + parseInt(freelancer.hourlyRate).toLocaleString() + '/hr' : 'Not set'}</p>
                </div>
                
                ${freelancer.skills ? `
                  <div class="mb-3">
                    <p class="text-sm font-medium mb-1">Skills:</p>
                    <div class="flex flex-wrap gap-1">
                      ${freelancer.skills.split(',').slice(0, 3).map(skill => 
                        `<span class="px-2 py-1 bg-indigo-100 text-indigo-800 text-xs rounded">${skill.trim()}</span>`
                      ).join('')}
                    </div>
                  </div>
                ` : ''}
                
                <div class="flex space-x-2">
                  <button onclick="showProfileModal('${freelancer.id}')" class="flex-1 bg-indigo-600 text-white px-3 py-1 rounded text-sm hover:bg-indigo-700">
                    View Profile
                  </button>
                  <button onclick="contactFreelancer('${freelancer.id}')" class="flex-1 bg-green-600 text-white px-3 py-1 rounded text-sm hover:bg-green-700">
                    Contact
                  </button>
                </div>
              </div>
            `;

            marker.bindPopup(popupContent, {
              maxWidth: 300,
              className: 'talent-popup'
            });

            marker.addTo(map);
            markers.push(marker);
          }
        });
      }
    }

    function updateStats() {
      const session = JSON.parse(localStorage.getItem('userSession') || 'null');
      const total = filteredFreelancers.length;
      const kigaliCount = filteredFreelancers.filter(f => f.location === 'Kigali').length;
      const otherCitiesCount = total - kigaliCount;
      const onlineCount = Math.floor(total * 0.7);

      if (session.role === 'freelancer') {
        document.getElementById('totalFreelancers').textContent = total;
        document.querySelector('#totalFreelancers').nextElementSibling.textContent = 'Available Jobs';
        document.getElementById('kigaliCount').textContent = kigaliCount;
        document.getElementById('otherCitiesCount').textContent = otherCitiesCount;
        document.getElementById('onlineCount').textContent = onlineCount;
        document.querySelector('#onlineCount').nextElementSibling.textContent = 'New Today';
      } else {
        document.getElementById('totalFreelancers').textContent = total;
        document.getElementById('kigaliCount').textContent = kigaliCount;
        document.getElementById('otherCitiesCount').textContent = otherCitiesCount;
        document.getElementById('onlineCount').textContent = onlineCount;
      }
    }

    function resetFilters() {
      document.getElementById('skillFilter').value = '';
      document.getElementById('experienceFilter').value = '';
      document.getElementById('locationFilter').value = '';
      applyFilters();
    }

    // Add interactive city markers
    function addCityMarkers() {
      const provinces = {
        'Kigali City': ['Kigali', 'Gasabo', 'Kicukiro', 'Nyarugenge'],
        'Northern': ['Musanze', 'Burera', 'Gakenke', 'Gicumbi', 'Rulindo'],
        'Southern': ['Huye', 'Gisagara', 'Kamonyi', 'Muhanga', 'Nyamagabe', 'Nyanza', 'Nyaruguru', 'Ruhango'],
        'Eastern': ['Nyagatare', 'Bugesera', 'Gatsibo', 'Kayonza', 'Kirehe', 'Ngoma', 'Rwamagana'],
        'Western': ['Rubavu', 'Karongi', 'Ngororero', 'Nyabihu', 'Nyamasheke', 'Rusizi', 'Rutsiro']
      };

      Object.entries(rwandaLocations).forEach(([city, coords]) => {
        const province = Object.keys(provinces).find(p => provinces[p].includes(city));
        const isCapital = ['Kigali', 'Musanze', 'Huye', 'Nyagatare', 'Rubavu'].includes(city);
        
        const cityMarker = L.marker(coords, {
          icon: L.divIcon({
            className: 'city-marker',
            html: `<div class="${isCapital ? 'bg-indigo-600 text-white' : 'bg-gray-600 text-white'} px-2 py-1 rounded text-xs font-medium shadow-lg hover:scale-110 transition-transform cursor-pointer">${city}</div>`,
            iconSize: [city.length * 8 + 16, 20],
            iconAnchor: [city.length * 4 + 8, 10]
          })
        });
        
        cityMarker.bindPopup(`
          <div class="text-center p-2">
            <h3 class="font-bold text-gray-800">${city}</h3>
            <p class="text-sm text-gray-600">${province} Province</p>
            <button onclick="filterByLocation('${city}')" class="mt-2 bg-blue-500 text-white px-3 py-1 rounded text-xs hover:bg-blue-600">
              Filter ${city}
            </button>
          </div>
        `);
        
        cityMarker.addTo(map);
      });
    }

    // Filter by location from city marker
    function filterByLocation(location) {
      document.getElementById('locationFilter').value = location;
      applyFilters();
      map.closePopup();
    }

    // Initialize city markers
    setTimeout(addCityMarkers, 1000);

    // Show client profile modal
    function showClientProfile(clientId) {
      const users = JSON.parse(localStorage.getItem('users') || '[]');
      const client = users.find(u => u.id === clientId);
      
      if (!client) {
        alert('Client information not found');
        return;
      }

      const modal = document.createElement('div');
      modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4';
      modal.innerHTML = `
        <div class="bg-white rounded-lg max-w-md w-full p-6">
          <div class="flex justify-between items-start mb-4">
            <h2 class="text-xl font-bold text-gray-800">Client Profile</h2>
            <button onclick="this.closest('.fixed').remove()" class="text-gray-400 hover:text-gray-600">
              <i class="fas fa-times"></i>
            </button>
          </div>
          
          <div class="text-center mb-4">
            ${client.profilePhoto ? 
              `<img src="${client.profilePhoto}" class="w-20 h-20 rounded-full mx-auto mb-3 object-cover">` :
              `<div class="w-20 h-20 bg-indigo-500 rounded-full flex items-center justify-center mx-auto mb-3">
                 <span class="text-white text-2xl font-bold">${client.fullName?.charAt(0) || client.name?.charAt(0) || 'C'}</span>
               </div>`
            }
            <h3 class="font-semibold text-gray-800">${client.fullName || client.name}</h3>
            <p class="text-gray-600">${client.companyName || 'Individual Client'}</p>
          </div>
          
          <div class="space-y-3">
            <div class="flex justify-between">
              <span class="text-gray-600">Email:</span>
              <span class="font-medium">${client.email}</span>
            </div>
            <div class="flex justify-between">
              <span class="text-gray-600">Location:</span>
              <span class="font-medium">${client.location || 'Not specified'}</span>
            </div>
            <div class="flex justify-between">
              <span class="text-gray-600">Member Since:</span>
              <span class="font-medium">${new Date(client.createdAt || Date.now()).toLocaleDateString()}</span>
            </div>
          </div>
          
          <div class="mt-6 flex space-x-3">
            <button onclick="connectWithClient('${clientId}')" class="flex-1 bg-green-600 text-white py-2 rounded-lg hover:bg-green-700">
              <i class="fas fa-comment mr-2"></i>Start Chat
            </button>
          </div>
        </div>
      `;
      
      document.body.appendChild(modal);
    }

    // Connect with client (redirect to chat)
    function connectWithClient(clientId) {
      const users = JSON.parse(localStorage.getItem('users') || '[]');
      const client = users.find(u => u.id === clientId);
      
      if (!client) {
        alert('Client not found');
        return;
      }
      
      // Store chat context and redirect to messages
      localStorage.setItem('chatContext', JSON.stringify({
        recipientId: clientId,
        recipientName: client.fullName || client.name,
        recipientType: 'client'
      }));
      
      window.location.href = 'freelancer-messages.html';
    }

    // Make functions global
    window.showClientProfile = showClientProfile;
    window.connectWithClient = connectWithClient;
    window.filterByLocation = filterByLocation;
  </script>
</body>
</html>
