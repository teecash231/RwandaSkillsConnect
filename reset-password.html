<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Rwanda SkillsConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--primary:#0056B3;--primary-light:#E8F2FF;--secondary:#00C896;--accent:#FF6B6B;--dark:#1A1F36;--gray:#64748B;--border:#E2E8F0;--radius:8px;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Open Sans',sans-serif;color:var(--dark);background:#F8FAFC;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    h2{font-family:'Poppins',sans-serif;font-weight:600;}
    .card{width:100%;max-width:400px;background:#fff;border-radius:var(--radius);box-shadow:0 2px 10px rgba(0,0,0,.07);padding:32px;animation:fadeIn .3s ease;}
    .logo{display:inline-flex;align-items:center;gap:10px;color:var(--primary);text-decoration:none;}
    .logo-icon{width:36px;height:36px;background:var(--primary);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;}
    .logo-text{font-size:1.4rem;font-weight:700;font-family:'Poppins',sans-serif;}
    .icon-circle{width:64px;height:64px;background:var(--primary-light);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;}
    .icon-circle i{font-size:28px;color:var(--primary);}
    .form-label{display:block;margin-bottom:4px;font-weight:500;font-size:13px;}
    .form-control{width:100%;padding:10px 40px 10px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;height:40px;transition:border-color .2s;}
    .form-control:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,86,179,.1);outline:none;}
    .input-wrap{position:relative;}
    .input-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--gray);font-size:14px;pointer-events:none;}
    .btn-primary-full{width:100%;padding:10px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;height:40px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s;}
    .btn-primary-full:hover{background:#004494;}
    .btn-primary-full:disabled{background:var(--border);cursor:not-allowed;}
    .alert{border-radius:var(--radius);border:none;padding:10px 14px;margin-bottom:16px;font-size:13px;display:flex;align-items:center;gap:8px;}
    .alert-danger{background:#FFF5F5;color:var(--accent);border-left:3px solid var(--accent);}
    .alert-success{background:#F0FFF4;color:#155724;border-left:3px solid var(--secondary);}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>
<div class="card">
  <div class="text-center mb-4">
    <a href="index.html" class="logo">
      <div class="logo-icon"><i class="fas fa-hands-helping"></i></div>
      <span class="logo-text">Rwanda SkillsConnect</span>
    </a>
  </div>

  <div class="icon-circle"><i class="fas fa-key"></i></div>
  <div class="text-center mb-4">
    <h2 style="font-size:1.3rem;">Set New Password</h2>
    <p style="color:var(--gray);font-size:13px;margin-top:6px;">Enter and confirm your new password below.</p>
  </div>

  <div id="msg" style="display:none;"></div>
  <div id="loadingMsg" class="text-center text-muted" style="font-size:13px;">
    <i class="fas fa-spinner fa-spin me-2"></i>Verifying reset link…
  </div>

  <form id="resetForm" style="display:none;">
    <div class="mb-3">
      <label class="form-label">New Password</label>
      <div class="input-wrap">
        <input type="password" id="newPassword" class="form-control" placeholder="Min. 6 characters" required minlength="6">
        <div class="input-icon"><i class="fas fa-lock"></i></div>
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label">Confirm Password</label>
      <div class="input-wrap">
        <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" required>
        <div class="input-icon"><i class="fas fa-lock"></i></div>
      </div>
      <div id="matchErr" style="display:none;color:var(--accent);font-size:11px;margin-top:4px;">
        <i class="fas fa-times"></i> Passwords don't match
      </div>
    </div>
    <button type="submit" class="btn-primary-full" id="saveBtn">
      <i class="fas fa-shield-alt"></i> Save New Password
    </button>
  </form>

  <p class="text-center mt-4" style="font-size:13px;color:var(--gray);border-top:1px solid var(--border);padding-top:16px;">
    <a href="login.html" style="color:var(--primary);text-decoration:none;">
      <i class="fas fa-arrow-left me-1"></i> Back to Sign In
    </a>
  </p>
</div>

<script src="js/supabaseClient.js"></script>
<script>
(async () => {
  // Supabase sends the recovery token as a hash fragment: #access_token=...&type=recovery
  // exchangeCodeForSession handles both PKCE code and hash-based tokens
  const { data: { session }, error } = await supabaseClient.auth.getSession();

  if (error || !session) {
    // Try to exchange from URL hash (Supabase v2 implicit flow)
    const hashParams = new URLSearchParams(window.location.hash.replace('#', ''));
    const accessToken  = hashParams.get('access_token');
    const refreshToken = hashParams.get('refresh_token');
    const type         = hashParams.get('type');

    if (type === 'recovery' && accessToken) {
      const { error: setErr } = await supabaseClient.auth.setSession({ access_token: accessToken, refresh_token: refreshToken || '' });
      if (setErr) {
        showMsg('Invalid or expired reset link. Please request a new one.', 'danger');
        document.getElementById('loadingMsg').style.display = 'none';
        return;
      }
    } else {
      showMsg('Invalid or expired reset link. <a href="forgot-password.html" style="color:var(--primary);">Request a new one</a>.', 'danger');
      document.getElementById('loadingMsg').style.display = 'none';
      return;
    }
  }

  document.getElementById('loadingMsg').style.display = 'none';
  document.getElementById('resetForm').style.display = 'block';

  document.getElementById('confirmPassword').addEventListener('input', () => {
    const match = document.getElementById('newPassword').value === document.getElementById('confirmPassword').value;
    document.getElementById('matchErr').style.display = match ? 'none' : 'block';
  });

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw  = document.getElementById('newPassword').value;
    const cpw = document.getElementById('confirmPassword').value;

    if (pw !== cpw) { document.getElementById('matchErr').style.display = 'block'; return; }
    if (pw.length < 6) { showMsg('Password must be at least 6 characters.', 'danger'); return; }

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';

    const { error } = await supabaseClient.auth.updateUser({ password: pw });

    if (error) {
      showMsg(error.message, 'danger');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-shield-alt"></i> Save New Password';
      return;
    }

    showMsg('✅ Password updated! Redirecting to login…', 'success');
    await supabaseClient.auth.signOut();
    setTimeout(() => window.location.href = 'login.html', 2000);
  });
})();

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.className = `alert alert-${type}`;
  el.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${text}`;
  el.style.display = 'flex';
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
