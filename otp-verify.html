<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email - Rwanda SkillsConnect</title>
  <!-- Tailwind CSS Production -->
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body class="bg-gray-100 min-h-screen">
  <!-- Header -->
  <div class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center py-4">
        <div class="flex items-center">
          <h1 class="text-xl font-bold text-gray-800">Rwanda SkillsConnect</h1>
        </div>
        <a href="register.html" class="text-blue-500 hover:text-blue-600 text-sm">Back to Register</a>
      </div>
    </div>
  </div>

  <!-- OTP Verification Section -->
  <div class="min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full space-y-8">
      <div class="text-center">
        <div class="mx-auto h-12 w-12 bg-blue-100 rounded-full flex items-center justify-center">
          <svg class="h-6 w-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
        </div>
        <h2 class="mt-6 text-3xl font-extrabold text-gray-900">Verify your email</h2>
        <p class="mt-2 text-sm text-gray-600">
          We've sent a verification code to <span id="emailDisplay" class="font-medium text-gray-900"></span>
        </p>
      </div>

      <form id="otpForm" class="mt-8 space-y-6">
        <div>
          <label for="otpCode" class="sr-only">Verification Code</label>
          <div class="flex justify-center space-x-2">
            <input type="text" id="otpCode" maxlength="6"
                   class="w-full px-3 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-center text-2xl font-mono tracking-widest"
                   placeholder="000000" required>
          </div>
          <p class="mt-2 text-sm text-gray-500 text-center">
            Enter the 6-digit code sent to your email
          </p>
        </div>

        <div>
          <button type="submit" id="verifyBtn"
                  class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-200">
            <span class="absolute left-0 inset-y-0 flex items-center pl-3">
              <svg class="h-5 w-5 text-blue-500 group-hover:text-blue-400" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path>
              </svg>
            </span>
            Verify Code
          </button>
        </div>

        <div class="text-center">
          <button type="button" id="resendBtn"
                  class="text-sm text-blue-600 hover:text-blue-500 transition duration-200">
            Didn't receive the code? Resend
          </button>
        </div>
      </form>

      <!-- Success Message (Hidden by default) -->
      <div id="successMessage" class="hidden text-center">
        <div class="rounded-md bg-green-50 p-4">
          <div class="flex">
            <div class="flex-shrink-0">
              <svg class="h-5 w-5 text-green-400" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
              </svg>
            </div>
            <div class="ml-3">
              <h3 class="text-sm font-medium text-green-800">Verification successful!</h3>
              <div class="mt-2 text-sm text-green-700">
                <p>Your account has been created. Redirecting to login...</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- JS -->
  <script src="assets/js/error-handler.js"></script>
  <script src="assets/js/email-service.js"></script>
  <script src="assets/js/supabase-auth.js"></script>
  <script src="assets/js/supabase-fallback.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth-fix.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const urlParams = new URLSearchParams(window.location.search);
      const email = urlParams.get('email');
      const role = urlParams.get('role');
      const method = urlParams.get('method') || 'local'; // 'supabase' or 'local'

      if (!email) {
        showNotification('Invalid access. Redirecting to registration...', 'error');
        setTimeout(() => {
          window.location.href = 'register.html';
        }, 2000);
        return;
      }

      // Check if user data exists in session
      const userData = JSON.parse(sessionStorage.getItem('pendingUserData') || '{}');
      if (!userData.email || userData.email !== email) {
        showNotification('Session expired. Please register again.', 'error');
        setTimeout(() => {
          window.location.href = 'register.html';
        }, 2000);
        return;
      }

      // Display email
      document.getElementById('emailDisplay').textContent = email;

      // Handle OTP form submission
      document.getElementById('otpForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const otpCode = document.getElementById('otpCode').value.trim();

        if (!otpCode || otpCode.length !== 6) {
          showNotification('Please enter a valid 6-digit code', 'error');
          return;
        }

        const verifyBtn = document.getElementById('verifyBtn');
        verifyBtn.disabled = true;
        verifyBtn.textContent = 'Verifying...';

        // Verify OTP
        const storedOTP = sessionStorage.getItem('otpCode');
        const otpExpiry = parseInt(sessionStorage.getItem('otpExpiry') || '0');

        if (Date.now() > otpExpiry) {
          showNotification('OTP has expired. Please request a new one.', 'error');
          verifyBtn.disabled = false;
          verifyBtn.textContent = 'Verify Code';
          return;
        }

        // Local OTP verification
        const storedOTP = sessionStorage.getItem('otpCode');
        const otpExpiry = parseInt(sessionStorage.getItem('otpExpiry') || '0');

        if (Date.now() > otpExpiry) {
          showNotification('OTP has expired. Please request a new one.', 'error');
          verifyBtn.disabled = false;
          verifyBtn.textContent = 'Verify Code';
          return;
        }
        
        // Verify OTP code
        if (otpCode === storedOTP) {
          // OTP is correct, create user account
          try {
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            
            // Double-check email doesn't exist
            if (users.find(user => user.email === userData.email)) {
              showNotification('Email already exists!', 'error');
              verifyBtn.disabled = false;
              verifyBtn.textContent = 'Verify Code';
              return;
            }

            const newUser = {
              id: userData.id,
              fullName: userData.fullName,
              email: userData.email,
              phone: userData.phone,
              role: userData.role,
              password: userData.password,
              createdAt: userData.createdAt,
              verified: true,
              emailVerified: true,
              verifiedAt: new Date().toISOString(),
              verificationMethod: method
            };

            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));

            // Clear session data
            sessionStorage.removeItem('pendingUserData');
            sessionStorage.removeItem('otpCode');
            sessionStorage.removeItem('otpExpiry');

            // Show success message
            document.getElementById('otpForm').classList.add('hidden');
            document.getElementById('successMessage').classList.remove('hidden');

            showNotification('Account created successfully! Redirecting to login...', 'success');

            // Redirect to login after 3 seconds
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 3000);

          } catch (error) {
            console.error('Account creation error:', error);
            showNotification('Failed to create account. Please try again.', 'error');
            verifyBtn.disabled = false;
            verifyBtn.textContent = 'Verify Code';
          }
        } else {
          showNotification('Invalid OTP code. Please try again.', 'error');
          verifyBtn.disabled = false;
          verifyBtn.textContent = 'Verify Code';
          
          // Clear the input
          document.getElementById('otpCode').value = '';
          document.getElementById('otpCode').focus();
        }
      });

      // Handle resend OTP
      document.getElementById('resendBtn').addEventListener('click', async function() {
        const userData = JSON.parse(sessionStorage.getItem('pendingUserData') || '{}');

        if (!userData.email) {
          showNotification('Session expired. Please register again.', 'error');
          window.location.href = 'register.html';
          return;
        }

        this.disabled = true;
        this.textContent = 'Sending...';

        // Always send OTP via email service
        const newOTP = generateOTP();
        sessionStorage.setItem('otpCode', newOTP);
        sessionStorage.setItem('otpExpiry', (Date.now() + 10 * 60 * 1000).toString());

        if (window.emailService) {
          await emailService.sendOTPEmail(userData.email, newOTP, {
            fullName: userData.fullName,
            role: userData.role
          });
        }
        
        showNotification('New verification code sent! Check the email inbox (bottom-left).', 'success');

        this.disabled = false;
        this.textContent = 'Didn\'t receive the code? Resend';
        
        // Clear the input
        document.getElementById('otpCode').value = '';
        document.getElementById('otpCode').focus();
      });

      // Auto-format OTP input
      document.getElementById('otpCode').addEventListener('input', function(e) {
        // Remove non-numeric characters
        this.value = this.value.replace(/[^0-9]/g, '');

        // Auto-submit when 6 digits entered
        if (this.value.length === 6) {
          setTimeout(() => {
            document.getElementById('otpForm').dispatchEvent(new Event('submit'));
          }, 500);
        }
      });

      // Add countdown timer for OTP expiry
      function startCountdown() {
        const otpExpiry = parseInt(sessionStorage.getItem('otpExpiry') || '0');
        if (otpExpiry === 0) return;

        const countdownEl = document.createElement('p');
        countdownEl.className = 'mt-2 text-sm text-gray-500 text-center';
        countdownEl.id = 'countdown';
        document.getElementById('otpCode').parentNode.appendChild(countdownEl);

        const timer = setInterval(() => {
          const remaining = Math.max(0, otpExpiry - Date.now());
          const minutes = Math.floor(remaining / 60000);
          const seconds = Math.floor((remaining % 60000) / 1000);

          if (remaining <= 0) {
            countdownEl.textContent = 'OTP expired. Please request a new one.';
            countdownEl.className = 'mt-2 text-sm text-red-500 text-center';
            clearInterval(timer);
          } else {
            countdownEl.textContent = `Code expires in ${minutes}:${seconds.toString().padStart(2, '0')}`;
          }
        }, 1000);
      }

      // Start countdown
      startCountdown();

      // Focus on OTP input
      document.getElementById('otpCode').focus();

      // Helper functions
      function generateOTP() {
        return Math.floor(100000 + Math.random() * 900000).toString();
      }

      function showNotification(message, type = 'success') {
        const notification = document.createElement('div');
        notification.className = `fixed top-4 right-4 z-50 p-4 rounded-lg shadow-lg transition-all duration-300 transform translate-x-full`;
        
        switch(type) {
          case 'success':
            notification.classList.add('bg-green-500', 'text-white');
            break;
          case 'error':
            notification.classList.add('bg-red-500', 'text-white');
            break;
          case 'warning':
            notification.classList.add('bg-yellow-500', 'text-white');
            break;
          case 'info':
            notification.classList.add('bg-blue-500', 'text-white');
            break;
          default:
            notification.classList.add('bg-gray-500', 'text-white');
        }
        
        notification.innerHTML = `
          <div class="flex items-center space-x-2">
            <span>${message}</span>
            <button onclick="this.parentElement.parentElement.remove()" class="ml-2 text-white hover:text-gray-200">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
              </svg>
            </button>
          </div>
        `;
        
        document.body.appendChild(notification);
        
        setTimeout(() => {
          notification.classList.remove('translate-x-full');
        }, 100);
        
        setTimeout(() => {
          notification.classList.add('translate-x-full');
          setTimeout(() => {
            if (notification.parentElement) {
              notification.remove();
            }
          }, 300);
        }, 3000);
      }
    });
  </script>
</body>
</html>
