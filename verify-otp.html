<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Rwanda SkillsConnect</title>
    <link rel="stylesheet" href="assets/css/tailwind.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-lg shadow-md p-8">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Verify Your Email</h2>
            <p class="text-gray-600">
                Enter the 6-digit code sent to<br>
                <strong id="emailDisplay" class="text-gray-800"></strong>
            </p>
        </div>
        
        <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>
        <div id="successMessage" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4"></div>
        
        <form id="otpForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 text-center">Verification Code</label>
                <input type="text" id="otpCode" maxlength="6" required 
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md text-center text-2xl font-mono tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="000000">
            </div>
            
            <button type="submit" id="verifyBtn"
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                Verify Email
            </button>
        </form>
        
        <div class="mt-4 text-center">
            <button id="resendBtn" class="text-blue-600 hover:text-blue-800">
                Resend Code
            </button>
        </div>
        
        <div class="mt-6 text-center">
            <a href="login.html" class="text-sm text-gray-600 hover:text-gray-800">Back to Sign In</a>
        </div>
    </div>

    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/auth-init.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        
        if (!email) {
            window.location.href = 'signup.html';
        }
        
        document.getElementById('emailDisplay').textContent = email;
        
        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const otpCode = document.getElementById('otpCode').value.trim();
            
            if (otpCode.length !== 6) {
                showMessage('Please enter a valid 6-digit code', 'error');
                return;
            }
            
            const verifyBtn = document.getElementById('verifyBtn');
            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verifying...';
            
            const result = await window.authSystem.verifySignupOTP(email, otpCode);
            
            if (result.success) {
                showMessage('Email verified successfully! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                showMessage(result.error, 'error');
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Verify Email';
            }
        });
        
        document.getElementById('resendBtn').addEventListener('click', async () => {
            const resendBtn = document.getElementById('resendBtn');
            resendBtn.disabled = true;
            resendBtn.textContent = 'Sending...';
            
            const result = await window.authSystem.resendOTP(email, 'signup');
            
            if (result.success) {
                showMessage('New verification code sent!', 'success');
            } else {
                showMessage(result.error, 'error');
            }
            
            resendBtn.disabled = false;
            resendBtn.textContent = 'Resend Code';
        });
        
        function showMessage(message, type) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');
            
            if (type === 'error') {
                errorDiv.textContent = message;
                errorDiv.classList.remove('hidden');
            } else {
                successDiv.textContent = message;
                successDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
