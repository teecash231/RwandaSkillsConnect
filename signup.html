<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Rwanda SkillsConnect</title>
    <link rel="stylesheet" href="assets/css/tailwind.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center py-8">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Create Account</h1>
            <p id="roleLabel" class="text-gray-500 mt-1">Join as a <span id="roleText" class="font-semibold text-blue-600">Worker</span></p>
        </div>

        <div id="msg" class="hidden mb-4 px-4 py-3 rounded text-sm"></div>

        <form id="signupForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="fullName" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" required autocomplete="email"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                <input type="tel" id="phone" placeholder="+250 7XX XXX XXX"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" required minlength="6" autocomplete="new-password"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input type="password" id="confirmPassword" required autocomplete="new-password"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" id="signupBtn"
                    class="w-full bg-blue-600 text-white py-2.5 rounded-lg hover:bg-blue-700 font-semibold transition-colors">
                Create Account
            </button>
        </form>

        <p class="mt-4 text-center text-sm text-gray-600">
            Already have an account? <a href="login.html" class="text-blue-600 hover:underline">Sign in</a>
        </p>
    </div>

    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
    <script>
        Auth.redirectIfLoggedIn();

        // Read role from URL: ?role=worker | employer | admin
        const params = new URLSearchParams(location.search);
        const role = ['worker','employer','admin'].includes(params.get('role'))
            ? params.get('role') : 'worker';

        const roleLabels = { worker: 'Worker', employer: 'Employer', admin: 'Admin' };
        document.getElementById('roleText').textContent = roleLabels[role];

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('signupBtn');

            const fullName = document.getElementById('fullName').value.trim();
            const email    = document.getElementById('email').value.trim().toLowerCase();
            const phone    = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirm  = document.getElementById('confirmPassword').value;

            if (password !== confirm) return showMsg('Passwords do not match.', 'error');
            if (password.length < 6)  return showMsg('Password must be at least 6 characters.', 'error');

            btn.disabled = true;
            btn.textContent = 'Creating account…';

            const result = await Auth.signUp(email, password, fullName, role, phone);

            if (result.success) {
                showMsg('✅ Account created! Check your email for a verification link.', 'success');
                setTimeout(() => {
                    window.location.href = `otp-verification.html?email=${encodeURIComponent(email)}`;
                }, 2000);
            } else {
                showMsg(result.error, 'error');
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        });

        function showMsg(text, type) {
            const el = document.getElementById('msg');
            el.textContent = text;
            el.className = `mb-4 px-4 py-3 rounded text-sm ${
                type === 'error'   ? 'bg-red-100 text-red-700 border border-red-300' :
                type === 'success' ? 'bg-green-100 text-green-700 border border-green-300' :
                                     'bg-blue-100 text-blue-700 border border-blue-300'
            }`;
            el.classList.remove('hidden');
        }
    </script>
</body>
</html>
