<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Profile - Rwanda SkillsConnect</title>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .profile-upload { position: relative; display: inline-block; }
    .profile-upload input[type=file] { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    .profile-image { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid #e5e7eb; }
  </style>
</head>
<body class="bg-gray-50">
  <header class="bg-white shadow-sm border-b sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4">
      <div class="flex justify-between items-center">
        <a href="client-dashboard.html" class="text-2xl font-bold text-indigo-600">Rwanda SkillsConnect</a>
        <nav class="hidden md:flex items-center space-x-6">
          <a href="client-dashboard.html" class="text-gray-600 hover:text-indigo-600">Dashboard</a>
          <a href="client-profile.html" class="text-indigo-600 font-medium">Profile</a>
          <a href="client-menu.html" class="text-gray-600 hover:text-indigo-600">Menu</a>
        </nav>
        <div class="flex items-center space-x-4">
          <div class="w-8 h-8 bg-indigo-500 rounded-full flex items-center justify-center">
            <span class="text-white font-semibold text-sm" id="userInitial">U</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-8">
    <div class="bg-white rounded-xl shadow-sm border p-8">
      <h1 class="text-2xl font-bold text-gray-900 mb-8">Client Profile</h1>
      
      <form id="profileForm" class="space-y-6">
        <!-- Profile Photo Section -->
        <div class="flex items-center space-x-6">
          <div class="profile-upload">
            <img id="profileImage" src="" alt="Profile" class="profile-image bg-gray-200 flex items-center justify-center">
            <div id="profilePlaceholder" class="profile-image bg-indigo-100 flex items-center justify-center">
              <i class="fas fa-user text-indigo-600 text-3xl"></i>
            </div>
            <input type="file" id="profilePhotoInput" accept="image/*">
          </div>
          <div>
            <h3 class="text-lg font-medium text-gray-900">Profile Photo</h3>
            <p class="text-gray-600 text-sm">Upload a professional photo</p>
            <button type="button" onclick="document.getElementById('profilePhotoInput').click()" class="mt-2 bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 text-sm">
              <i class="fas fa-upload mr-2"></i>Upload Photo
            </button>
          </div>
        </div>

        <!-- Basic Information -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Full Name *</label>
            <input type="text" id="fullName" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Email *</label>
            <input type="email" id="email" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
            <input type="tel" id="phone" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Location</label>
            <select id="location" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
              <option value="">Select Location</option>
              <option value="Kigali">Kigali</option>
              <option value="Huye">Huye</option>
              <option value="Musanze">Musanze</option>
              <option value="Rubavu">Rubavu</option>
              <option value="Nyagatare">Nyagatare</option>
            </select>
          </div>
        </div>

        <!-- Company Information -->
        <div class="border-t pt-6">
          <h3 class="text-lg font-medium text-gray-900 mb-4">Company Information</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Company Name</label>
              <input type="text" id="companyName" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Industry</label>
              <select id="industry" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                <option value="">Select Industry</option>
                <option value="Technology">Technology</option>
                <option value="Healthcare">Healthcare</option>
                <option value="Finance">Finance</option>
                <option value="Education">Education</option>
                <option value="Retail">Retail</option>
                <option value="Manufacturing">Manufacturing</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-2">Company Description</label>
              <textarea id="companyDescription" rows="3" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="Brief description of your company..."></textarea>
            </div>
          </div>
        </div>

        <!-- Preferences -->
        <div class="border-t pt-6">
          <h3 class="text-lg font-medium text-gray-900 mb-4">Hiring Preferences</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Preferred Project Types</label>
              <div class="space-y-2">
                <label class="flex items-center">
                  <input type="checkbox" value="web-development" class="project-type mr-2">
                  <span class="text-sm">Web Development</span>
                </label>
                <label class="flex items-center">
                  <input type="checkbox" value="mobile-development" class="project-type mr-2">
                  <span class="text-sm">Mobile Development</span>
                </label>
                <label class="flex items-center">
                  <input type="checkbox" value="graphic-design" class="project-type mr-2">
                  <span class="text-sm">Graphic Design</span>
                </label>
                <label class="flex items-center">
                  <input type="checkbox" value="content-writing" class="project-type mr-2">
                  <span class="text-sm">Content Writing</span>
                </label>
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Budget Range (USD)</label>
              <select id="budgetRange" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                <option value="">Select Budget Range</option>
                <option value="100-500">$100 - $500</option>
                <option value="500-1000">$500 - $1,000</option>
                <option value="1000-5000">$1,000 - $5,000</option>
                <option value="5000+">$5,000+</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-end space-x-4 pt-6 border-t">
          <button type="button" onclick="window.location.href='client-dashboard.html'" class="px-6 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50">
            Cancel
          </button>
          <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
            <i class="fas fa-save mr-2"></i>Save Profile
          </button>
        </div>
      </form>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
  <script src="fix-access-control.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const session = JSON.parse(localStorage.getItem('userSession') || 'null');
      if (!session) {
        window.location.href = 'login.html';
        return;
      }

      // Load existing profile data
      loadProfileData(session);

      // Handle profile photo upload
      document.getElementById('profilePhotoInput').addEventListener('change', handlePhotoUpload);

      // Handle form submission
      document.getElementById('profileForm').addEventListener('submit', handleProfileSave);
    });

    function loadProfileData(session) {
      const users = JSON.parse(localStorage.getItem('users') || '[]');
      const user = users.find(u => u.id === session.id) || session;

      // Basic info
      document.getElementById('fullName').value = user.fullName || user.name || '';
      document.getElementById('email').value = user.email || '';
      document.getElementById('phone').value = user.phone || '';
      document.getElementById('location').value = user.location || '';

      // Company info
      document.getElementById('companyName').value = user.companyName || '';
      document.getElementById('industry').value = user.industry || '';
      document.getElementById('companyDescription').value = user.companyDescription || '';
      document.getElementById('budgetRange').value = user.budgetRange || '';

      // Project types
      if (user.projectTypes) {
        user.projectTypes.forEach(type => {
          const checkbox = document.querySelector(`input[value="${type}"]`);
          if (checkbox) checkbox.checked = true;
        });
      }

      // Profile photo
      if (user.profilePhoto) {
        document.getElementById('profileImage').src = user.profilePhoto;
        document.getElementById('profileImage').style.display = 'block';
        document.getElementById('profilePlaceholder').style.display = 'none';
      }

      // Update initial
      document.getElementById('userInitial').textContent = (user.fullName || user.name || 'U').charAt(0).toUpperCase();
    }

    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('profileImage').src = e.target.result;
          document.getElementById('profileImage').style.display = 'block';
          document.getElementById('profilePlaceholder').style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    }

    function handleProfileSave(event) {
      event.preventDefault();
      
      const session = JSON.parse(localStorage.getItem('userSession') || 'null');
      if (!session) return;

      // Collect form data
      const projectTypes = Array.from(document.querySelectorAll('.project-type:checked')).map(cb => cb.value);
      
      const profileData = {
        fullName: document.getElementById('fullName').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        location: document.getElementById('location').value,
        companyName: document.getElementById('companyName').value,
        industry: document.getElementById('industry').value,
        companyDescription: document.getElementById('companyDescription').value,
        budgetRange: document.getElementById('budgetRange').value,
        projectTypes: projectTypes,
        profilePhoto: document.getElementById('profileImage').src || null
      };

      // Update user in localStorage
      let users = JSON.parse(localStorage.getItem('users') || '[]');
      const userIndex = users.findIndex(u => u.id === session.id);
      
      if (userIndex !== -1) {
        users[userIndex] = { ...users[userIndex], ...profileData };
      } else {
        users.push({ ...session, ...profileData });
      }
      
      localStorage.setItem('users', JSON.stringify(users));

      // Update session
      const updatedSession = { ...session, ...profileData };
      localStorage.setItem('userSession', JSON.stringify(updatedSession));

      showNotification('Profile updated successfully!', 'success');
      setTimeout(() => {
        window.location.href = 'client-dashboard.html';
      }, 1500);
    }

    function showNotification(message, type) {
      const notification = document.createElement('div');
      notification.className = `fixed top-4 right-4 z-50 p-4 rounded-lg shadow-lg ${type === 'success' ? 'bg-green-500' : 'bg-red-500'} text-white`;
      notification.textContent = message;
      document.body.appendChild(notification);
      setTimeout(() => notification.remove(), 3000);
    }
  </script>
</body>
</html>
