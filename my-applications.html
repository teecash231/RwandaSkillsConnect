<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Applications — Rwanda SkillsConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #f5f7fa; }
    .sidebar { width: 260px; background: #fff; border-right: 1px solid #E2E8F0; position: fixed; top: 0; left: 0; height: 100vh; z-index: 1000; display: flex; flex-direction: column; }
    .main-content { margin-left: 260px; min-height: 100vh; }
    .menu-item { display: flex; align-items: center; gap: 12px; padding: 11px 20px; color: #64748B; text-decoration: none; font-size: 14px; font-weight: 500; transition: all .2s; }
    .menu-item:hover, .menu-item.active { background: #E8F2FF; color: #0056B3; }
    .menu-item.active { border-left: 3px solid #0056B3; }
    .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .status-pending     { background: #fff3cd; color: #856404; }
    .status-reviewing   { background: #cce5ff; color: #004085; }
    .status-shortlisted { background: #d1ecf1; color: #0c5460; }
    .status-accepted    { background: #d4edda; color: #155724; }
    .status-rejected    { background: #f8d7da; color: #721c24; }
    .app-card { background: #fff; border-radius: 10px; border: 1px solid #E2E8F0; padding: 20px; transition: box-shadow .2s; }
    .app-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.08); }
    #toast { position: fixed; top: 20px; right: 20px; z-index: 9999; min-width: 280px; }
    @media(max-width:992px) { .sidebar { transform: translateX(-100%); } .main-content { margin-left: 0; } }
  </style>
</head>
<body>

<div id="toast" class="toast align-items-center border-0" role="alert">
  <div class="d-flex">
    <div class="toast-body fw-medium" id="toastMsg"></div>
    <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
  </div>
</div>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="p-4 border-bottom">
    <div class="d-flex align-items-center gap-2">
      <div style="width:36px;height:36px;background:linear-gradient(135deg,#0056B3,#00C896);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;"><i class="fas fa-hands-helping"></i></div>
      <div><div class="fw-bold" style="font-size:15px;">SkillsConnect</div><div class="text-muted" style="font-size:11px;">Rwanda</div></div>
    </div>
  </div>
  <nav class="flex-grow-1 py-3">
    <div class="px-4 pb-2" style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8;font-weight:600;">Dashboard</div>
    <a href="freelancer-dashboard.html" class="menu-item"><i class="fas fa-tachometer-alt"></i>Overview</a>
    <a href="profile.html" class="menu-item"><i class="fas fa-user"></i>My Profile</a>
    <div class="px-4 pb-2 pt-3" style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8;font-weight:600;">Jobs</div>
    <a href="find-jobs.html" class="menu-item"><i class="fas fa-search"></i>Find Jobs</a>
    <a href="my-applications.html" class="menu-item active"><i class="fas fa-file-alt"></i>My Applications</a>
    <div class="px-4 pb-2 pt-3" style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8;font-weight:600;">Earnings</div>
    <a href="worker-earnings.html" class="menu-item"><i class="fas fa-wallet"></i>Earnings</a>
    <a href="worker-transactions.html" class="menu-item"><i class="fas fa-history"></i>Transactions</a>
    <a href="worker-earnings.html#invoices" class="menu-item"><i class="fas fa-file-invoice"></i>Invoices</a>
    <div class="px-4 pb-2 pt-3" style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8;font-weight:600;">Communication</div>
    <a href="messages.html" class="menu-item"><i class="fas fa-comments"></i>Messages</a>
    <a href="notifications.html" class="menu-item"><i class="fas fa-bell"></i>Notifications</a>
  </nav>
  <div class="border-top py-2">
    <a href="client-settings.html" class="menu-item"><i class="fas fa-cog"></i>Settings</a>
    <a href="#" class="menu-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i>Logout</a>
  </div>
</aside>

<main class="main-content">
  <header class="bg-white border-bottom px-4 py-3 sticky-top">
    <h5 class="mb-0 fw-bold">My Applications</h5>
    <small class="text-muted">Track the status of your job applications</small>
  </header>

  <div class="p-4">
    <!-- Stats -->
    <div class="row g-3 mb-4" id="statsRow">
      <div class="col-6 col-md-3"><div class="bg-white rounded-3 p-3 border text-center"><div class="fw-bold fs-4" id="statTotal">—</div><div class="text-muted small">Total</div></div></div>
      <div class="col-6 col-md-3"><div class="bg-white rounded-3 p-3 border text-center"><div class="fw-bold fs-4 text-warning" id="statPending">—</div><div class="text-muted small">Pending</div></div></div>
      <div class="col-6 col-md-3"><div class="bg-white rounded-3 p-3 border text-center"><div class="fw-bold fs-4 text-success" id="statAccepted">—</div><div class="text-muted small">Accepted</div></div></div>
      <div class="col-6 col-md-3"><div class="bg-white rounded-3 p-3 border text-center"><div class="fw-bold fs-4 text-danger" id="statRejected">—</div><div class="text-muted small">Rejected</div></div></div>
    </div>

    <!-- Filter -->
    <div class="d-flex gap-2 mb-4 flex-wrap">
      <button class="btn btn-sm btn-primary filter-btn active" data-status="">All</button>
      <button class="btn btn-sm btn-outline-secondary filter-btn" data-status="pending">Pending</button>
      <button class="btn btn-sm btn-outline-secondary filter-btn" data-status="reviewing">Reviewing</button>
      <button class="btn btn-sm btn-outline-secondary filter-btn" data-status="shortlisted">Shortlisted</button>
      <button class="btn btn-sm btn-outline-secondary filter-btn" data-status="accepted">Accepted</button>
      <button class="btn btn-sm btn-outline-secondary filter-btn" data-status="rejected">Rejected</button>
    </div>

    <div id="appsList">
      <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
    </div>
  </div>
</main>

<!-- Cover Letter Modal -->
<div class="modal fade" id="coverModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">Cover Letter</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="coverModalBody"></div>
    </div>
  </div>
</div>

<script src="js/supabaseClient.js"></script>
<script src="js/applications.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
let allApps = [];
let currentFilter = '';
const toastEl = new bootstrap.Toast(document.getElementById('toast'), { delay: 3000 });
const coverModal = new bootstrap.Modal(document.getElementById('coverModal'));

function notify(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.className = `toast align-items-center border-0 text-bg-${type}`;
  document.getElementById('toastMsg').textContent = msg;
  toastEl.show();
}

function jobTypeLabel(t) {
  return { full_time: 'Full Time', part_time: 'Part Time', contract: 'Contract', internship: 'Internship' }[t] || t || '';
}

function renderApps(apps) {
  const container = document.getElementById('appsList');
  if (!apps.length) {
    container.innerHTML = `<div class="text-center py-5 text-muted">
      <i class="fas fa-file-alt fa-3x mb-3 d-block opacity-25"></i>
      <p>No applications found.</p>
      <a href="find-jobs.html" class="btn btn-primary btn-sm">Browse Jobs</a>
    </div>`;
    return;
  }
  container.innerHTML = apps.map(app => {
    const job = app.jobs || {};
    const employer = job.profiles || {};
    const statusClass = `status-${app.status || 'pending'}`;
    return `
    <div class="app-card mb-3">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
        <div>
          <h6 class="fw-bold mb-1">${job.title || 'Job Removed'}</h6>
          <div class="text-muted small mb-1">
            <i class="fas fa-building me-1"></i>${employer.company_name || employer.full_name || 'Company'}
            ${job.location ? `<span class="ms-3"><i class="fas fa-map-marker-alt me-1"></i>${job.location}</span>` : ''}
            ${job.job_type ? `<span class="ms-3"><i class="fas fa-briefcase me-1"></i>${jobTypeLabel(job.job_type)}</span>` : ''}
          </div>
          ${job.salary_range_min ? `<div class="text-success small fw-medium">RWF ${parseInt(job.salary_range_min).toLocaleString()}${job.salary_range_max ? ' – ' + parseInt(job.salary_range_max).toLocaleString() : ''}</div>` : ''}
        </div>
        <span class="status-badge ${statusClass}">${app.status || 'pending'}</span>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
        <span class="text-muted" style="font-size:12px;">Applied ${new Date(app.applied_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span>
        <div class="d-flex gap-2">
          ${app.cover_letter ? `<button class="btn btn-sm btn-outline-secondary" onclick="showCover(${app.id})"><i class="fas fa-envelope me-1"></i>Cover Letter</button>` : ''}
          ${job.id ? `<a href="find-jobs.html" class="btn btn-sm btn-outline-primary"><i class="fas fa-external-link-alt me-1"></i>View Job</a>` : ''}
          ${app.status === 'pending' ? `<button class="btn btn-sm btn-outline-danger" onclick="withdrawApp(${app.id})"><i class="fas fa-times me-1"></i>Withdraw</button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function applyFilter(status) {
  currentFilter = status;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('btn-primary', b.dataset.status === status);
    b.classList.toggle('active', b.dataset.status === status);
    b.classList.toggle('btn-outline-secondary', b.dataset.status !== status);
  });
  renderApps(status ? allApps.filter(a => a.status === status) : allApps);
}

function updateStats() {
  document.getElementById('statTotal').textContent    = allApps.length;
  document.getElementById('statPending').textContent  = allApps.filter(a => a.status === 'pending' || a.status === 'reviewing' || a.status === 'shortlisted').length;
  document.getElementById('statAccepted').textContent = allApps.filter(a => a.status === 'accepted').length;
  document.getElementById('statRejected').textContent = allApps.filter(a => a.status === 'rejected').length;
}

async function withdrawApp(appId) {
  if (!confirm('Withdraw this application? This cannot be undone.')) return;
  try {
    await ApplicationService.withdraw(appId, (await supabaseClient.auth.getSession()).data.session.user.id);
    allApps = allApps.filter(a => a.id !== appId);
    updateStats();
    applyFilter(currentFilter);
    notify('Application withdrawn');
  } catch (err) {
    notify(err.message || 'Failed to withdraw', 'danger');
  }
}

function showCover(appId) {
  const app = allApps.find(a => a.id === appId);
  if (!app) return;
  document.getElementById('coverModalBody').innerHTML = `<p class="text-muted" style="white-space:pre-wrap;">${app.cover_letter || 'No cover letter provided.'}</p>`;
  coverModal.show();
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => applyFilter(btn.dataset.status));
});

document.getElementById('logoutBtn').addEventListener('click', async (e) => {
  e.preventDefault();
  await supabaseClient.auth.signOut();
  window.location.href = 'login.html';
});

document.addEventListener('DOMContentLoaded', async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', session.user.id).single();
  if (profile?.role === 'employer') { window.location.href = 'employer-dashboard.html'; return; }
  if (profile?.role === 'admin')    { window.location.href = 'admin-dashboard.html'; return; }

  const { data, error } = await supabaseClient
    .from('job_applications')
    .select('*, jobs(id, title, location, job_type, salary_range_min, salary_range_max, profiles!jobs_employer_id_fkey(full_name, company_name))')
    .eq('worker_id', session.user.id)
    .order('applied_at', { ascending: false });

  if (error) {
    document.getElementById('appsList').innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
    return;
  }

  allApps = data || [];
  updateStats();
  applyFilter('');
});

window.showCover = showCover;
window.withdrawApp = withdrawApp;
</script>
</body>
</html>
