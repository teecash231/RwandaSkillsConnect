<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirming Email - Rwanda SkillsConnect</title>
    <link rel="stylesheet" href="assets/css/tailwind.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-lg shadow-md p-8 text-center">
        <div class="animate-spin w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full mx-auto mb-4"></div>
        <h2 class="text-xl font-semibold text-gray-800 mb-2">Confirming your email...</h2>
        <p class="text-gray-600" id="status">Please wait while we verify your account.</p>
    </div>

    <script src="js/supabaseClient.js"></script>
    <script>
        async function handleEmailConfirmation() {
            try {
                const urlParams = new URLSearchParams(window.location.hash.substring(1));
                const type = new URLSearchParams(window.location.search).get('type');
                const accessToken = urlParams.get('access_token');
                const refreshToken = urlParams.get('refresh_token');
                
                if (!accessToken) {
                    throw new Error('No confirmation token found');
                }

                const { data, error } = await window.supabaseClient.auth.setSession({
                    access_token: accessToken,
                    refresh_token: refreshToken
                });

                if (error) throw error;

                if (type === 'recovery') {
                    document.getElementById('status').textContent = 'Password reset confirmed! Redirecting...';
                    setTimeout(() => {
                        window.location.href = 'reset-password.html';
                    }, 2000);
                    return;
                }

                // Create profile for new signups
                const pendingData = JSON.parse(sessionStorage.getItem('pendingUserData') || '{}');
                
                if (pendingData.first_name && data.user) {
                    try {
                        await window.supabaseClient
                            .from('profiles')
                            .upsert({
                                id: data.user.id,
                                first_name: pendingData.first_name,
                                last_name: pendingData.last_name,
                                email: data.user.email,
                                role: pendingData.role || 'user'
                            });
                    } catch (profileError) {
                        console.warn('Profile creation failed:', profileError);
                    }
                }

                sessionStorage.removeItem('pendingUserData');
                
                document.getElementById('status').textContent = 'Email confirmed! Redirecting to dashboard...';
                
                setTimeout(() => {
                    const role = pendingData.role || data.user.user_metadata?.role || 'user';
                    switch(role) {
                        case 'worker':
                            window.location.href = 'freelancer-dashboard.html';
                            break;
                        case 'employer':
                            window.location.href = 'employer-dashboard.html';
                            break;
                        case 'admin':
                            window.location.href = 'admin-dashboard.html';
                            break;
                        default:
                            window.location.href = 'login.html?confirmed=true';
                    }
                }, 2000);

            } catch (error) {
                console.error('Confirmation error:', error);
                document.getElementById('status').innerHTML = `
                    <span class="text-red-600">Confirmation failed: ${error.message}</span><br>
                    <a href="login.html" class="text-blue-600 hover:underline mt-2 inline-block">Go to Login</a>
                `;
            }
        }

        window.addEventListener('load', handleEmailConfirmation);
    </script>
</body>
</html>
