<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Status | Rwanda SkillsConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #F8FAFC; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { border: none; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.1); max-width: 420px; width: 100%; }
    .icon-circle { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1rem; }
  </style>
</head>
<body>
  <div class="card p-5 text-center" id="statusCard">
    <div class="spinner-border text-primary mb-3" style="width:3rem;height:3rem;"></div>
    <p class="text-muted">Verifying your payment...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
  (async () => {
    const params = new URLSearchParams(location.search);
    const status  = params.get('status');
    const tx_ref  = params.get('tx_ref');
    const card    = document.getElementById('statusCard');

    // Flutterwave redirects with ?status=successful&tx_ref=...&transaction_id=...
    if (status === 'successful' && tx_ref) {
      card.innerHTML = `
        <div class="icon-circle bg-success text-white"><i class="fas fa-check"></i></div>
        <h4 class="fw-bold text-success mb-2">Payment Successful!</h4>
        <p class="text-muted mb-1">Reference: <strong>${tx_ref}</strong></p>
        <p class="text-muted small mb-4">Your wallet will be updated shortly via webhook confirmation.</p>
        <a href="wallet.html" class="btn btn-success w-100 mb-2">View Wallet</a>
        <a href="employer-payments.html" class="btn btn-outline-secondary w-100">View Payments</a>`;
    } else if (status === 'cancelled') {
      card.innerHTML = `
        <div class="icon-circle bg-warning text-white"><i class="fas fa-times"></i></div>
        <h4 class="fw-bold text-warning mb-2">Payment Cancelled</h4>
        <p class="text-muted mb-4">You cancelled the payment. No funds were charged.</p>
        <a href="wallet.html" class="btn btn-primary w-100">Back to Wallet</a>`;
    } else {
      card.innerHTML = `
        <div class="icon-circle bg-danger text-white"><i class="fas fa-exclamation-triangle"></i></div>
        <h4 class="fw-bold text-danger mb-2">Payment Failed</h4>
        <p class="text-muted mb-4">Something went wrong. Please try again.</p>
        <a href="wallet.html" class="btn btn-primary w-100">Try Again</a>`;
    }
  })();
  </script>
</body>
</html>
