<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post a Job — Rwanda SkillsConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #f5f7fa; }
    .step-dot { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; border: 2px solid #dee2e6; background: #fff; color: #6c757d; transition: all .3s; }
    .step-dot.active { border-color: #0056B3; background: #0056B3; color: #fff; }
    .step-dot.done { border-color: #00C896; background: #00C896; color: #fff; }
    .step-line { flex: 1; height: 2px; background: #dee2e6; margin: 0 8px; transition: background .3s; }
    .step-line.done { background: #00C896; }
    .form-step { display: none; }
    .form-step.active { display: block; }
    .card { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
    .btn-primary { background: #0056B3; border-color: #0056B3; }
    .btn-primary:hover { background: #003D82; border-color: #003D82; }
    #toast { position: fixed; top: 20px; right: 20px; z-index: 9999; min-width: 280px; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-light bg-white border-bottom px-4 py-3 sticky-top">
  <a class="navbar-brand fw-bold text-primary" href="employer-dashboard.html">
    <i class="fas fa-hands-helping me-2"></i>SkillsConnect
  </a>
  <div class="d-flex align-items-center gap-3">
    <a href="employer-dashboard.html" class="text-muted text-decoration-none"><i class="fas fa-arrow-left me-1"></i>Dashboard</a>
    <a href="jobs.html" class="text-muted text-decoration-none">My Jobs</a>
    <a href="find-workers.html" class="text-muted text-decoration-none">Find Workers</a>
    <a href="job-applications.html" class="text-muted text-decoration-none">Applicants</a>
    <a href="messages.html" class="text-muted text-decoration-none">Messages</a>
    <a href="notifications.html" class="text-muted text-decoration-none">Notifications</a>
    <button id="logoutBtn" class="btn btn-sm btn-outline-danger"><i class="fas fa-sign-out-alt me-1"></i>Logout</button>
  </div>
</nav>

<div id="toast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
  <div class="d-flex">
    <div class="toast-body fw-medium" id="toastMsg"></div>
    <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
  </div>
</div>

<main class="container py-5" style="max-width:760px;">
  <div class="text-center mb-4">
    <h2 class="fw-bold">Post a New Job</h2>
    <p class="text-muted">Fill in the details to find the right worker</p>
  </div>

  <!-- Step Indicator -->
  <div class="d-flex align-items-center justify-content-center mb-4">
    <div class="step-dot active" id="dot1">1</div>
    <div class="step-line" id="line1"></div>
    <div class="step-dot" id="dot2">2</div>
    <div class="step-line" id="line2"></div>
    <div class="step-dot" id="dot3">3</div>
  </div>

  <div class="card p-4">
    <form id="jobForm" novalidate>

      <!-- Step 1: Basic Info -->
      <div class="form-step active" id="step1">
        <h5 class="fw-semibold mb-4">Basic Information</h5>
        <div class="mb-3">
          <label class="form-label fw-medium">Job Title <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="title" placeholder="e.g. Senior Web Developer" required>
        </div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-medium">Job Type <span class="text-danger">*</span></label>
            <select class="form-select" id="jobType" required>
              <option value="">Select type</option>
              <option value="full_time">Full Time</option>
              <option value="part_time">Part Time</option>
              <option value="contract">Contract</option>
              <option value="internship">Internship</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-medium">Experience Level <span class="text-danger">*</span></label>
            <select class="form-select" id="expLevel" required>
              <option value="">Select level</option>
              <option value="entry">Entry (0–2 yrs)</option>
              <option value="intermediate">Intermediate (2–5 yrs)</option>
              <option value="expert">Expert (5+ yrs)</option>
            </select>
          </div>
        </div>
        <div class="mt-3">
          <label class="form-label fw-medium">Location <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="location" placeholder="e.g. Kigali, Huye, Remote…" required>
        </div>
      </div>

      <!-- Step 2: Details -->
      <div class="form-step" id="step2">
        <h5 class="fw-semibold mb-4">Job Details</h5>
        <div class="mb-3">
          <label class="form-label fw-medium">Description <span class="text-danger">*</span></label>
          <textarea class="form-control" id="description" rows="5" placeholder="Describe the role, responsibilities, and expectations..." required></textarea>

        </div>
        <div class="mb-3">
          <label class="form-label fw-medium">Requirements</label>
          <textarea class="form-control" id="requirements" rows="3" placeholder="List qualifications, certifications, or must-haves..."></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label fw-medium">Skills Required</label>
          <input type="text" class="form-control" id="skills" placeholder="e.g. JavaScript, React, Node.js (comma-separated)">
        </div>
      </div>

      <!-- Step 3: Budget & Publish -->
      <div class="form-step" id="step3">
        <h5 class="fw-semibold mb-4">Budget &amp; Publish</h5>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-medium">Min Salary (RWF)</label>
            <input type="number" class="form-control" id="salaryMin" placeholder="e.g. 100000" min="0">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-medium">Max Salary (RWF)</label>
            <input type="number" class="form-control" id="salaryMax" placeholder="e.g. 500000" min="0">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-medium">Application Deadline</label>
          <input type="date" class="form-control" id="deadline">
        </div>
        <div class="mb-3">
          <label class="form-label fw-medium">Vacancies</label>
          <input type="number" class="form-control" id="vacancies" value="1" min="1" max="100">
        </div>
        <div class="mb-3">
          <label class="form-label fw-medium">Publish Status</label>
          <div class="d-flex gap-3">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="status" id="statusActive" value="active" checked>
              <label class="form-check-label" for="statusActive">Publish Now</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="status" id="statusDraft" value="draft">
              <label class="form-check-label" for="statusDraft">Save as Draft</label>
            </div>
          </div>
        </div>
      </div>

      <!-- Navigation -->
      <div class="d-flex justify-content-between mt-4 pt-3 border-top">
        <button type="button" id="prevBtn" class="btn btn-outline-secondary" style="display:none!important;">
          <i class="fas fa-arrow-left me-2"></i>Previous
        </button>
        <div class="ms-auto d-flex gap-2">
          <button type="button" id="nextBtn" class="btn btn-primary">
            Next<i class="fas fa-arrow-right ms-2"></i>
          </button>
          <button type="submit" id="submitBtn" class="btn btn-success" style="display:none!important;">
            <i class="fas fa-check me-2"></i><span id="submitLabel">Post Job</span>
          </button>
        </div>
      </div>
    </form>
  </div>
</main>

<script src="js/supabaseClient.js"></script>
<script src="js/jobs.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
let currentStep = 1;
const totalSteps = 3;
let currentUser = null;
let editJobId = null;

const toast = new bootstrap.Toast(document.getElementById('toast'), { delay: 3500 });
function notify(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.className = `toast align-items-center border-0 text-bg-${type}`;
  document.getElementById('toastMsg').textContent = msg;
  toast.show();
}

function setStep(step) {
  for (let i = 1; i <= totalSteps; i++) {
    document.getElementById(`step${i}`).classList.toggle('active', i === step);
    const dot = document.getElementById(`dot${i}`);
    dot.classList.remove('active', 'done');
    if (i < step) dot.classList.add('done');
    else if (i === step) dot.classList.add('active');
    if (i < totalSteps) {
      document.getElementById(`line${i}`).classList.toggle('done', i < step);
    }
  }
  document.getElementById('prevBtn').style.display = step > 1 ? '' : 'none';
  document.getElementById('nextBtn').style.display = step < totalSteps ? '' : 'none';
  document.getElementById('submitBtn').style.display = step === totalSteps ? '' : 'none';
}

function validateStep(step) {
  if (step === 1) {
    const t = document.getElementById('title').value.trim();
    const jt = document.getElementById('jobType').value;
    const el = document.getElementById('expLevel').value;
    const loc = document.getElementById('location').value;
    if (!t || !jt || !el || !loc) { notify('Please fill all required fields', 'danger'); return false; }
  }

  return true;
}

document.getElementById('nextBtn').addEventListener('click', () => {
  if (validateStep(currentStep)) { currentStep++; setStep(currentStep); }
});
document.getElementById('prevBtn').addEventListener('click', () => {
  currentStep--; setStep(currentStep);
});

document.getElementById('jobForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!validateStep(3)) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  document.getElementById('submitLabel').textContent = 'Saving...';

  const salaryMin = parseFloat(document.getElementById('salaryMin').value) || null;
  const salaryMax = parseFloat(document.getElementById('salaryMax').value) || null;
  if (salaryMin && salaryMax && salaryMin >= salaryMax) {
    notify('Max salary must be greater than min salary', 'danger');
    btn.disabled = false;
    document.getElementById('submitLabel').textContent = editJobId ? 'Update Job' : 'Post Job';
    return;
  }

  const payload = {
    title:               document.getElementById('title').value.trim(),
    job_type:            document.getElementById('jobType').value,
    experience_level:    document.getElementById('expLevel').value,
    location:            document.getElementById('location').value,
    description:         document.getElementById('description').value.trim(),
    requirements:        document.getElementById('requirements').value.trim() || null,
    skills_required:     document.getElementById('skills').value.trim() || null,
    salary_range_min:    salaryMin,
    salary_range_max:    salaryMax,
    salary_currency:     'RWF',
    application_deadline: document.getElementById('deadline').value || null,
    vacancy_count:       parseInt(document.getElementById('vacancies').value) || 1,
    status:              document.querySelector('input[name="status"]:checked').value
  };

  try {
    if (editJobId) {
      await JobService.updateJob(editJobId, currentUser.id, payload);
      notify('Job updated successfully!', 'success');
    } else {
      await JobService.createJob(currentUser.id, payload);
      notify('Job posted successfully!', 'success');
    }
    setTimeout(() => window.location.href = 'jobs.html', 1500);
  } catch (err) {
    notify(err.message || 'Failed to save job', 'danger');
    btn.disabled = false;
    document.getElementById('submitLabel').textContent = editJobId ? 'Update Job' : 'Post Job';
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await supabaseClient.auth.signOut();
  window.location.href = 'login.html';
});

// Set min date for deadline
document.getElementById('deadline').min = new Date().toISOString().split('T')[0];

document.addEventListener('DOMContentLoaded', async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', session.user.id).single();
  if (profile?.role !== 'employer') { window.location.href = 'freelancer-dashboard.html'; return; }

  currentUser = session.user;

  // Edit mode: load job from URL param
  const params = new URLSearchParams(location.search);
  editJobId = params.get('edit') ? parseInt(params.get('edit')) : null;
  if (editJobId) {
    document.querySelector('h2').textContent = 'Edit Job';
    document.getElementById('submitLabel').textContent = 'Update Job';
    try {
      const job = await JobService.getJobById(editJobId);
      if (job.employer_id !== currentUser.id) { window.location.href = 'jobs.html'; return; }
      document.getElementById('title').value       = job.title || '';
      document.getElementById('jobType').value     = job.job_type || '';
      document.getElementById('expLevel').value    = job.experience_level || '';
      document.getElementById('location').value    = job.location || '';
      document.getElementById('description').value = job.description || '';
      document.getElementById('requirements').value = job.requirements || '';
      document.getElementById('skills').value      = job.skills_required || '';
      document.getElementById('salaryMin').value   = job.salary_range_min || '';
      document.getElementById('salaryMax').value   = job.salary_range_max || '';
      document.getElementById('deadline').value    = job.application_deadline || '';
      document.getElementById('vacancies').value   = job.vacancy_count || 1;
      const statusRadio = document.querySelector(`input[name="status"][value="${job.status}"]`);
      if (statusRadio) statusRadio.checked = true;
    } catch { window.location.href = 'jobs.html'; }
  }

  setStep(1);
});
</script>
</body>
</html>
