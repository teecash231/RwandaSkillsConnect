<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Rwanda SkillsConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--primary:#0056B3;--primary-light:#E8F2FF;--secondary:#00C896;--accent:#FF6B6B;--dark:#1A1F36;--gray:#64748B;--border:#E2E8F0;--radius:8px;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Open Sans',sans-serif;color:var(--dark);background:#F8FAFC;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    h1,h2,h3{font-family:'Poppins',sans-serif;font-weight:600;}
    .card{width:100%;max-width:400px;background:#fff;border-radius:var(--radius);box-shadow:0 2px 10px rgba(0,0,0,.07);padding:32px;animation:fadeIn .3s ease;}
    .logo{display:inline-flex;align-items:center;gap:10px;color:var(--primary);text-decoration:none;}
    .logo-icon{width:36px;height:36px;background:var(--primary);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;}
    .logo-text{font-size:1.4rem;font-weight:700;font-family:'Poppins',sans-serif;}
    .icon-circle{width:64px;height:64px;background:var(--primary-light);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;}
    .icon-circle i{font-size:28px;color:var(--primary);}
    .form-label{display:block;margin-bottom:4px;font-weight:500;font-size:13px;}
    .form-control{width:100%;padding:10px 40px 10px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;height:40px;transition:border-color .2s;}
    .form-control:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,86,179,.1);outline:none;}
    .input-wrap{position:relative;}
    .input-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--gray);font-size:14px;pointer-events:none;}
    .btn-primary-full{width:100%;padding:10px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;height:40px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s;}
    .btn-primary-full:hover{background:#004494;}
    .btn-primary-full:disabled{background:var(--border);cursor:not-allowed;}
    .alert{border-radius:var(--radius);border:none;padding:10px 14px;margin-bottom:16px;font-size:13px;display:flex;align-items:center;gap:8px;}
    .alert-danger{background:#FFF5F5;color:var(--accent);border-left:3px solid var(--accent);}
    .alert-success{background:#F0FFF4;color:#155724;border-left:3px solid var(--secondary);}
    /* OTP boxes */
    .otp-boxes{display:flex;gap:10px;justify-content:center;margin:16px 0;}
    .otp-box{width:44px;height:52px;border:2px solid var(--border);border-radius:var(--radius);font-size:22px;font-weight:700;text-align:center;transition:border-color .2s;outline:none;}
    .otp-box:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,86,179,.1);}
    .step{display:none;}
    .step.active{display:block;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>
<div class="card">
  <div class="text-center mb-4">
    <a href="index.html" class="logo">
      <div class="logo-icon"><i class="fas fa-hands-helping"></i></div>
      <span class="logo-text">Rwanda SkillsConnect</span>
    </a>
  </div>

  <!-- Step 1: Enter email -->
  <div class="step active" id="step1">
    <div class="icon-circle"><i class="fas fa-lock"></i></div>
    <div class="text-center mb-4">
      <h2 style="font-size:1.3rem;">Forgot Password?</h2>
      <p style="color:var(--gray);font-size:13px;margin-top:6px;">Enter your email and we'll send you a 6-digit code.</p>
    </div>
    <div id="msg1" style="display:none;"></div>
    <form id="emailForm">
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <div class="input-wrap">
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
          <div class="input-icon"><i class="fas fa-envelope"></i></div>
        </div>
      </div>
      <button type="submit" class="btn-primary-full" id="sendBtn">
        <i class="fas fa-paper-plane"></i> Send Code
      </button>
    </form>
  </div>

  <!-- Step 2: Enter OTP + new password -->
  <div class="step" id="step2">
    <div class="icon-circle"><i class="fas fa-key"></i></div>
    <div class="text-center mb-3">
      <h2 style="font-size:1.3rem;">Enter Reset Code</h2>
      <p style="color:var(--gray);font-size:13px;margin-top:6px;">
        We sent a 6-digit code to <strong id="emailDisplay"></strong>
      </p>
    </div>
    <div id="msg2" style="display:none;"></div>
    <form id="resetForm">
      <div class="otp-boxes">
        <input class="otp-box" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
        <input class="otp-box" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
        <input class="otp-box" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
        <input class="otp-box" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
        <input class="otp-box" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
        <input class="otp-box" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
      </div>
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <div class="input-wrap">
          <input type="password" id="newPassword" class="form-control" placeholder="Aa1! uppercase, lowercase, digit, symbol" required>
          <div class="input-icon"><i class="fas fa-lock"></i></div>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Confirm Password</label>
        <div class="input-wrap">
          <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" required>
          <div class="input-icon"><i class="fas fa-lock"></i></div>
        </div>
        <div id="matchErr" style="display:none;color:var(--accent);font-size:11px;margin-top:4px;">
          <i class="fas fa-times"></i> Passwords don't match
        </div>
      </div>
      <button type="submit" class="btn-primary-full" id="resetBtn">
        <i class="fas fa-shield-alt"></i> Reset Password
      </button>
    </form>
    <p class="text-center mt-3" style="font-size:12px;color:var(--gray);">
      Didn't receive it?
      <button id="resendBtn" style="background:none;border:none;color:var(--primary);font-size:12px;cursor:pointer;padding:0;" disabled>
        Resend (<span id="countdown">60</span>s)
      </button>
    </p>
  </div>

  <p class="text-center mt-4" style="font-size:13px;color:var(--gray);border-top:1px solid var(--border);padding-top:16px;">
    <a href="login.html" style="color:var(--primary);text-decoration:none;">
      <i class="fas fa-arrow-left me-1"></i> Back to Sign In
    </a>
  </p>
</div>

<script src="js/supabaseClient.js"></script>
<script>
let _email = '';
let _timer = null;

// ── OTP box auto-advance ──────────────────────────────────
document.querySelectorAll('.otp-box').forEach((box, i, boxes) => {
  box.addEventListener('input', () => {
    box.value = box.value.replace(/\D/g, '');
    if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
  });
  box.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !box.value && i > 0) boxes[i - 1].focus();
  });
  box.addEventListener('paste', e => {
    e.preventDefault();
    const digits = (e.clipboardData.getData('text').replace(/\D/g, '')).slice(0, 6);
    [...digits].forEach((d, j) => { if (boxes[j]) boxes[j].value = d; });
    const next = Math.min(digits.length, boxes.length - 1);
    boxes[next].focus();
  });
});

function getOtp() {
  return [...document.querySelectorAll('.otp-box')].map(b => b.value).join('');
}

// ── Step 1: Send OTP ──────────────────────────────────────
document.getElementById('emailForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('sendBtn');
  _email = document.getElementById('email').value.trim().toLowerCase();

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending…';

  const { error } = await supabaseClient.auth.resetPasswordForEmail(_email);

  if (error) {
    const msg = error.message.toLowerCase().includes('rate limit')
      ? 'Too many requests. Please wait a few minutes before trying again.'
      : error.message;
    showMsg('msg1', msg, 'danger');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Code';
    return;
  }

  // Move to step 2
  document.getElementById('step1').classList.remove('active');
  document.getElementById('step2').classList.add('active');
  document.getElementById('emailDisplay').textContent = _email;
  document.querySelectorAll('.otp-box')[0].focus();
  startCountdown();
});

// ── Step 2: Verify OTP + set new password ─────────────────
document.getElementById('resetForm').addEventListener('submit', async e => {
  e.preventDefault();
  const otp  = getOtp();
  const pw   = document.getElementById('newPassword').value;
  const cpw  = document.getElementById('confirmPassword').value;

  if (otp.length < 6) { showMsg('msg2', 'Please enter the full 6-digit code.', 'danger'); return; }
  if (pw !== cpw)     { document.getElementById('matchErr').style.display = 'block'; return; }
  if (!/[a-z]/.test(pw) || !/[A-Z]/.test(pw) || !/\d/.test(pw) || !/[^a-zA-Z0-9]/.test(pw)) {
    showMsg('msg2', 'Password must have uppercase, lowercase, digit & symbol.', 'danger'); return;
  }

  document.getElementById('matchErr').style.display = 'none';

  const btn = document.getElementById('resetBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying…';

  // Verify OTP (type: 'recovery')
  const { error: otpErr } = await supabaseClient.auth.verifyOtp({
    email: _email,
    token: otp,
    type: 'recovery'
  });

  if (otpErr) {
    showMsg('msg2', 'Invalid or expired code. Please try again.', 'danger');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-shield-alt"></i> Reset Password';
    return;
  }

  // OTP valid — now update password
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating…';
  const { error: pwErr } = await supabaseClient.auth.updateUser({ password: pw });

  if (pwErr) {
    showMsg('msg2', pwErr.message, 'danger');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-shield-alt"></i> Reset Password';
    return;
  }

  showMsg('msg2', '✅ Password reset! Redirecting to login…', 'success');
  await supabaseClient.auth.signOut();
  setTimeout(() => window.location.href = 'login.html', 2000);
});

// ── Resend countdown ──────────────────────────────────────
function startCountdown() {
  let secs = 60;
  document.getElementById('resendBtn').disabled = true;
  document.getElementById('countdown').textContent = secs;
  clearInterval(_timer);
  _timer = setInterval(() => {
    secs--;
    document.getElementById('countdown').textContent = secs;
    if (secs <= 0) {
      clearInterval(_timer);
      const btn = document.getElementById('resendBtn');
      btn.disabled = false;
      btn.innerHTML = 'Resend code';
    }
  }, 1000);
}

document.getElementById('resendBtn').addEventListener('click', async () => {
  document.getElementById('resendBtn').disabled = true;
  document.getElementById('resendBtn').innerHTML = 'Resend (<span id="countdown">60</span>s)';
  await supabaseClient.auth.resetPasswordForEmail(_email);
  showMsg('msg2', 'A new code has been sent.', 'success');
  startCountdown();
});

// ── Confirm password match check ──────────────────────────
document.getElementById('confirmPassword').addEventListener('input', () => {
  const match = document.getElementById('newPassword').value === document.getElementById('confirmPassword').value;
  document.getElementById('matchErr').style.display = match ? 'none' : 'block';
});

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.className = `alert alert-${type}`;
  el.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${text}`;
  el.style.display = 'flex';
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
